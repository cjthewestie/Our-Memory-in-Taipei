<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Memory in Taipei</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="photos.css">   <!-- issue #17: the street markers and the photograph panel (photos.js) -->
<link rel="stylesheet" href="walk.css">     <!-- the square and free walking (walk.js) -->
<link rel="stylesheet" href="memories.css"> <!-- the visitors' memories (memories.js) -->
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- Scroll spacer. The canvas never scrolls; this page does, over it. -->
  <div class="scroll" aria-hidden="true">
    <section data-era="open"></section>
    <section data-era="red"></section>
    <section data-era="dadao"></section>
    <section data-era="tower"></section>
    <section data-era="close"></section>
  </div>

  <div id="labels" aria-hidden="true"></div>

  <div class="hud">
    <!-- the phone guide (2026-09-24, CJ 「首頁壓按不要 箭頭要」): the swipe-up arrow over the opening screen, no dim, phone only; app.js clears it with the fog -->
    <div class="hud-guide" id="guide" aria-hidden="true"><div class="guide-arrow"></div><div class="guide-word">Scroll</div></div>
    <div class="hud-title">Our Memory <span>in Taipei</span></div>
    <div class="hud-chapter">
      <div class="chap-col">
        <div class="chap-n"><span id="chapN">01</span><span class="chap-of">/03</span></div>
        <div class="chap-name" id="eraLabel"></div>
        <div class="chap-years" id="eraYears"></div>
      </div>
      <div class="chap-zh" id="eraZh"></div>
    </div>
    <div class="hud-word" id="word"><div class="word-big"></div><div class="word-sub"></div></div>
    <div class="hud-closing" id="closing"></div>
    <!-- the opening title (issue #16): waits in the fog at scroll 0, app.js fades and recolours it -->
    <div class="hud-opening" id="opening"><div class="op-big"><span>Our Memory</span> <span>in Taipei</span></div><div class="op-sub">Three generations. One street.</div></div>
    <div class="hud-year"><span class="hud-year-k">YEAR</span><span id="year">1853</span></div>
    <!-- the decade music player (music.js): an audio bar over an unseen YouTube player per decade, local loops when YouTube cannot play.
         CJ, 2026-09-24: 「左下角youtube 變成音訊條可以拉就好」 -->
    <div class="hud-music" id="music" role="group" aria-label="Music">
      <div class="mus-body">
        <div class="mus-k">MUSIC · <span id="musDecade">1980s</span> · <span id="musStatus">connecting to YouTube…</span></div>
        <div class="mus-track" id="musTrack"></div>
        <div class="mus-bar">
          <button class="mus-play" id="musPlay" type="button" aria-label="Play" aria-pressed="false">
            <svg class="ic-play" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1l7 4-7 4z"/></svg>
            <svg class="ic-pause" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1h2.4v8H1.5zM6.1 1h2.4v8H6.1z"/></svg>
          </button>
          <span class="mus-time" id="musNow">0:00</span>
          <div class="mus-scrub" id="musScrub" role="slider" tabindex="0" aria-label="Position in the song" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="mus-fill" id="musFill"></div><div class="mus-knob" id="musKnob"></div></div>
          <span class="mus-time" id="musDur">0:00</span>
        </div>
        <div class="mus-row">
          <div class="mus-decades">
            <button type="button" data-decade="1980s" aria-label="Play the 1980s videos">80s</button>
            <button type="button" data-decade="1990s" aria-label="Play the 1990s videos">90s</button>
            <button type="button" data-decade="2000s" aria-label="Play the 2000s videos">00s</button>
            <button type="button" data-decade="2010s" aria-label="Play the 2010s videos">10s</button>
          </div>
          <button class="mus-mute" id="musMute" type="button" title="Sound (m)" aria-pressed="false">Click to play</button>
        </div>
        <!-- the player lives here, clipped to nothing and transparent; never display: none, or some browsers stop the audio -->
        <div class="mus-hide" id="musBox" aria-hidden="true"><div id="musEmbed"></div></div>
      </div>
    </div>
  </div>

  <script src="three.min.js"></script>
  <script src="GLTFLoader.js"></script>
  <script src="meshopt_decoder.js"></script>   <!-- the packed models (tools/pack-models.sh) need it -->
  <script src="asset/3d/assets-core.js"></script>
  <script src="asset/3d/assets-ximen-1980s.js"></script>
  <script src="asset/3d/assets-ximen-1990s.js"></script>
  <script src="asset/3d/assets-ximen-2000s.js"></script>
  <script src="asset/3d/assets-dadaocheng-1980s.js"></script>
  <script src="asset/3d/assets-dadaocheng-1990s.js"></script>
  <script src="asset/3d/assets-dadaocheng-2000s.js"></script>
  <script src="data.js"></script>
  <script src="models.js"></script>
  <script src="app.js"></script>
  <script src="scene-red.js"></script>
  <script src="scene-dadao.js"></script>
  <script src="scene-tower.js"></script>
  <script src="music.js"></script>
  <script src="photos.js"></script>   <!-- issue #17: clickable points that show the real place -->
  <script src="walk.js"></script>                <!-- the square, the gates, free walking; ?tour=1 for the scroll film -->
  <script src="memories-config.js"></script>     <!-- where memories are stored (Supabase); empty = this browser only -->
  <script src="memories.js"></script>            <!-- lanterns people leave on the street, and the form to leave one -->
</body>
</html>
