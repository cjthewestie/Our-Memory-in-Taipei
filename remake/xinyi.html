<script>
// 信義, the 2020s: a compact stone plaza at the foot of Taipei 101, the skywalk crossing overhead,
// 新光三越 A11 to the west, glass towers to the east. Only this block's layout lives here; the light,

// The sun comes in low from the north-west, so the tall buildings cut it into one band of light

const SOLID = [];                                                 // [x, z, halfW, halfD] boxes she walks round
const solid = (x, z, hx, hz) => SOLID.push([x, z, hx + 0.3, hz + 0.3]);
const WALK = [[-17, 17, -17.5, 19], [-3.2, 3.2, 19, 23], [-4.6, 4.6, -35, -17.5], [-13, 36, -43.3, -34.8], [-37.5, -13, -44.6, -34.8]];
ENGINE.create({
  title: '信義 · Xinyi, 2020s', subtitle: 'Glass, steel and height, at the foot of Taipei 101', loading: 'Raising the towers…',
  shadowCenter: [0, 0, -6], start: { x: 0, z: 10.5, heading: Math.PI },
  views: [[0, 1.5, 17.6, 4, 21, -66], [-13, 2.4, -34.6, 6, 4.5, -44], [-33, 2.6, -31.5, -17, 5, -44], [-12, 2.2, 3, 24, 15, 4], [9, 2, -9, -22, 8, -13.5], [0, 3.2, -3, 0, 13, 30]],   // 1 the tower through the skywalk · 2 its forecourt · 3 四四南村 · 4 the east side · 5 威秀 · 6 the south side
  ground: { strips: [], puddles: 0 },
  dust: { x: [-20, 20], y: [0.3, 13], z: [-20, 22] },
  clamp(p) {
    // the walkable ground is a set of boxes [minX, maxX, minZ, maxZ]: the plaza, the south gate, the zebra crossing,
    // the forecourt of Taipei 101 and 四四南村's lane. Outside all of them she is put back on the nearest edge.
    let best = null, bd = Infinity;
    for (const [x0, x1, z0, z1] of WALK) { const cx = Math.max(x0, Math.min(x1, p.x)), cz = Math.max(z0, Math.min(z1, p.z)), d = (cx - p.x) ** 2 + (cz - p.z) ** 2; if (d < bd) { bd = d; best = [cx, cz]; } }
    if (bd > 0) { p.x = best[0]; p.z = best[1]; }
    for (const [x, z, hx, hz] of SOLID) { const dx = p.x - x, dz = p.z - z; if (Math.abs(dx) < hx && Math.abs(dz) < hz) { if (hx - Math.abs(dx) < hz - Math.abs(dz)) p.x = x + (dx < 0 ? -hx : hx); else p.z = z + (dz < 0 ? -hz : hz); } }
    PHOTOWALL.keepOut(p);                                           // and round the topic showcases
  },
  onFrame: (E) => { if (E.heroPos.z > 22) E.leave('square.html?from=xinyi', '廣場 · The Square', 500); },   // out of the south gate, back to the square
  models: ['bundle-tower', 'bundle-core', 'bundle-square'],
  build(E, [tw, core, sq]) {
  const { T, scene, rr, R, col, canvasTex, speckle, TEX, MATS, GLOW, triMat, dress, get, place, board, sign, canopy, lanternString, stall, city, uTime } = E;
  const box = (w, h, d, mat, x, y, z, ry) => { const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); if (ry) m.rotation.y = ry; m.castShadow = m.receiveShadow = true; scene.add(m); return m; };
  if (E.QS.get('debug')) document.getElementById('load').style.transition = 'none';                 // test shots: no fade on the loading cover
  const flat = (w, d, mat, x, y, z) => { const m = new T.Mesh(new T.PlaneGeometry(w, d), mat); m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); return m; };

  // ── the ground: wet granite pavers with dark bands, a road to the north with a zebra crossing ──
  { const cells = []; for (let i = 0; i < 64; i++) cells.push(Math.random());
    const mk = (kind) => canvasTex(1024, (g, s) => { const n = 8, w = s / n;
      g.fillStyle = kind === 'col' ? '#3d3b3a' : '#606060'; g.fillRect(0, 0, s, s);
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) { const v = cells[r * n + c], band = r === 0 || c === 0;
        g.fillStyle = kind === 'col' ? (band ? `hsl(24,6%,${22 + v * 6}%)` : `hsl(${26 + v * 10},${7 + v * 6}%,${40 + v * 13}%)`) : `rgb(0,${band ? 70 + v * 30 : 95 + v * 75},0)`;
        g.fillRect(c * w + 2, r * w + 2, w - 4, w - 4); }
      if (kind === 'col') { speckle(g, s, 26000, 0.16, true); speckle(g, s, 12000, 0.12, false); } }, 1);

    const asphalt = canvasTex(512, (g, s) => { g.fillStyle = '#2b2c30'; g.fillRect(0, 0, s, s); speckle(g, s, 22000, 0.22, true); speckle(g, s, 9000, 0.14, false); }, 1); asphalt.repeat.set(60, 4);
    flat(240, 14, new T.MeshStandardMaterial({ map: asphalt, roughness: 0.5 }), 0, 0.02, -27.5);
    const paint = new T.MeshStandardMaterial({ color: col('#d9d2c2'), roughness: 0.6 }), yellow = new T.MeshStandardMaterial({ color: col('#d2a83a'), roughness: 0.6 });

      const pm = new T.Mesh(new T.ShapeGeometry(sh, 6), new T.MeshStandardMaterial({ color: 0x23272c, roughness: 0.03, transparent: true, opacity: 0.42 }));
      pm.rotation.set(-Math.PI / 2, 0, rr(0, 3)); pm.position.set(rr(-15, 15), 0.019, rr(-15, 17)); pm.receiveShadow = true; scene.add(pm); } }

  const glass101 = triMat({ color: '#4f8f8a', tex: TEX.metal, scale: 0.6, rough: 0.2, metal: 0.4 });
  { const t = dress(get(tw, 'tower101').clone(), { swap: { haze: glass101, glass: triMat({ color: '#2f6f78', tex: TEX.metal, scale: 1, rough: 0.1, metal: 0.6 }), lamp: GLOW(2.6, 1.7, 0.8) } }); t.position.set(13, 0, -72); t.scale.setScalar(1.6); scene.add(t); }

  // ── glass towers: a curtain wall drawn on a canvas, sky reflected in the panes, some floors lit ──
  const facade = (cols, rows, tint, litP) => { const lit = []; let run = 0; for (let i = 0; i < cols * rows; i++) { if (i % cols === 0) run = 0; if (run > 0) run--; else if (R() < litP * (0.35 + 0.9 * i / (cols * rows)) * 0.3) run = 2 + (R() * 5 | 0); lit.push([run > 0, R()]); }
    const mk = (emi) => canvasTex(512, (g, s) => { const cw = s / cols, rh = s / rows; g.fillStyle = emi ? '#000' : '#12161b'; g.fillRect(0, 0, s, s);
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const [on, v] = lit[r * cols + c], k = r / rows, m = (a, b) => Math.round((a + (b - a) * k * k) * (0.82 + v * 0.3) * tint);
        if (on) g.fillStyle = `rgb(${225 + v * 30 | 0},${160 + v * 45 | 0},${88 + v * 50 | 0})`; else if (emi) continue; else g.fillStyle = `rgb(${m(48, 150)},${m(80, 112)},${m(108, 92)})`;   // blue sky up top, the warm horizon near the street
        g.fillRect(c * cw + 1.5, r * rh + rh * 0.3, cw - 3, rh * 0.7 - 1); } }, 1);
    const map = mk(false), emi = mk(true);
    return new T.MeshStandardMaterial({ map, emissiveMap: emi, emissive: new T.Color(1, 1, 1), emissiveIntensity: 1.0, roughness: 0.16, metalness: 0.35 }); };
  const roofM = triMat({ color: '#3a3d42', tex: TEX.concrete, scale: 0.3, rough: 0.8 }), steel = triMat({ color: '#9aa3ab', tex: TEX.metal, scale: 2, rough: 0.3, metal: 0.7 }), stone = triMat({ color: '#b9b2a6', tex: TEX.concrete, scale: 0.8, rough: 0.5 });
  const shopTex = canvasTex(512, (g, s) => { g.fillStyle = '#1a1c20'; g.fillRect(0, 0, s, s); for (let i = 0; i < 4; i++) { const gr = g.createLinearGradient(0, s * 0.2, 0, s); gr.addColorStop(0, '#ffe2ae'); gr.addColorStop(1, '#f0a45c'); g.fillStyle = gr; g.fillRect(i * s / 4 + 8, s * 0.22, s / 4 - 16, s * 0.7); g.fillStyle = 'rgba(40,24,12,.55)'; for (let k = 0; k < 3; k++) g.fillRect(i * s / 4 + 22 + k * 34, s * (0.55 + 0.1 * ((i + k) % 3)), 20, s * 0.4); } }, 1);
  const tower = (x, z, w, d, h, o = {}) => { const f = o.f || facade(o.cols || Math.round(w / 1.25), o.rows || Math.round(h / 3.4), o.tint || 1, o.lit == null ? 0.2 : o.lit);
    box(w, h, d, [f, f, roofM, roofM, f, f], x, h / 2, z, o.ry);
    if (o.cap) box(w * 0.62, o.cap, d * 0.62, [f, f, roofM, roofM, f, f], x, h + o.cap / 2, z, o.ry);
    box(w * 0.2, 2.2, d * 0.2, roofM, x, h + (o.cap || 0) + 1.1, z, o.ry); const b = new T.Mesh(new T.SphereGeometry(0.35, 8, 6), GLOW(4, 0.5, 0.3)); b.position.set(x, h + (o.cap || 0) + 2.6, z); scene.add(b);
    if (o.shop) { const st = shopTex.clone(); st.needsUpdate = true; st.repeat.set(Math.round(w / 9), 1); const sm = new T.MeshStandardMaterial({ map: st, emissiveMap: st, emissive: new T.Color(1, 1, 1), emissiveIntensity: 0.95, roughness: 0.3 });
      box(w + 1.2, 6.4, d + 1.2, [sm, sm, stone, stone, sm, sm], x, 3.2, z, o.ry); box(w + 3, 0.3, d + 3, steel, x, 6.6, z, o.ry); } };
  // the east side (南山廣場, ATT 4 FUN), the south side (誠品, 市府轉運站) and 威秀 are built in landmarks-xinyi.js
  tower(-26, -62, 16, 16, 66, { tint: 1.1, cap: 6, lit: 0.18 });                      // north-west: this one cuts the sun into a band
  tower(-52, -14, 22, 26, 96, { tint: 0.85, cap: 12, lit: 0.15 });
  tower(70, 12, 26, 22, 74, { tint: 0.9, lit: 0.2 }); tower(-62, 30, 24, 24, 70, { tint: 0.9, lit: 0.2 });
  // far towers, in the haze, and the low city behind them
  { const far = [facade(18, 30, 0.8, 0.12), facade(16, 36, 0.7, 0.1), facade(20, 24, 0.9, 0.16)]; let n = 0;
    while (n < 24) { const a = rr(0, 6.283), r = rr(125, 215), x = Math.cos(a) * r, z = Math.sin(a) * r; if (x < -40 && z < -30) continue; if (Math.abs(x - 13) < 55 && z < -72) continue; if (Math.hypot(x - 158, z + 92) < 95) continue; /* not behind the tower, not inside 象山 */ tower(x, z, rr(18, 28), rr(18, 28), rr(46, 120), { f: far[n % 3], ry: rr(0, 1.5) }); n++; } }
  tower(-54.5, -56, 36, 18, 30, { ry: 0.71, tint: 0.9, lit: 0.3, shop: true });    // a mid-rise across the gap the sun comes through: its shadow ends short of the plaza, and it keeps that gap from washing out
  city(115, 225);

  { const c = dress(get(tw, 'cityhall').clone()); c.position.set(-118, 0, -112); c.rotation.y = 0.82; c.scale.setScalar(0.8); scene.add(c); }

  // ── 新光三越 A11, west side, its front to the plaza ──
  { const a = dress(get(tw, 'a11').clone(), { swap: { brick: triMat({ color: '#c9b9a8', tex: TEX.concrete, scale: 0.35, rough: 0.55 }) } }); a.position.set(-30.5, 0, 4); a.rotation.y = Math.PI / 2; scene.add(a); }
  { const b = board([['新光三越', 170, 0.36], ['SHIN KONG MITSUKOSHI · A11', 54, 0.78, 600]], 9, 2.6, '#7a1f2a', '#fff0d2', 1.1); b.position.set(-18.2, 7.5, 4); b.rotation.y = Math.PI / 2; scene.add(b);
    const st = shopTex.clone(); st.needsUpdate = true; st.repeat.set(3, 1); const sm = new T.MeshStandardMaterial({ map: st, emissiveMap: st, emissive: new T.Color(1, 1, 1), emissiveIntensity: 0.95, roughness: 0.3 });
    box(0.5, 5.6, 20, [sm, sm, stone, stone, stone, stone], -18.85, 2.8, 4); box(3.4, 0.28, 21.5, steel, -17.9, 5.95, 4); }                          // its lit shop windows and the canopy over the doors
  sign('百貨公司', -18.5, 8.4, -3.6, Math.PI / 2, 350, true); sign('美食街', -18.5, 8.0, 14.6, Math.PI / 2, 28, true);

  // ── the skywalk, crossing overhead from A11 to the east tower ──
  const skySwap = { swap: { sky: triMat({ color: '#9fcfe0', tex: TEX.metal, scale: 1, rough: 0.15, metal: 0.3 }) }, noCast: ['glass'] };
  { const sw = get(tw, 'skywalk'), cr = dress(get(sw, 'crossing').clone(), skySwap); cr.position.set(0, 0, -6); scene.add(cr);
    const seg = get(sw, 'segment'); for (let x = 9.7; x < 21; x += 1) for (const k of [-1, 1]) { const s = dress(seg.clone(), skySwap); s.position.set(k * x, 0, -6); scene.add(s); }
    for (const x of [-15, 15]) { box(0.5, 6.1, 0.5, steel, x, 3.05, -6); solid(x, -6, 0.25, 0.25); }
    solid(-7.6, -2, 1.7, 5.9); solid(7.6, -2, 1.7, 5.9); }                                               // the two stairs and their columns

  const bulbs = [];
  [[-9, 12], [9, 12], [-12.6, 3.6], [11.6, 3.2], [-10, -13.5], [10, -13.5]].forEach(([x, z], i) => {
    box(2.6, 0.5, 2.6, stone, x, 0.25, z); box(2.3, 0.06, 2.3, soil, x, 0.5, z); box(2.9, 0.07, 0.5, wood, x, 0.54, z + 1.2); box(2.9, 0.07, 0.5, wood, x, 0.54, z - 1.2);
    for (const k of [-1, 1]) { const l = new T.Mesh(new T.BoxGeometry(2.4, 0.03, 0.03), GLOW(2.6, 1.6, 0.7)); l.position.set(x, 0.07, z + k * 1.33); scene.add(l); }
    const tr = new T.Mesh(new T.CylinderGeometry(0.11, 0.17, 3.6, 8), bark); tr.position.set(x, 2.3, z); tr.castShadow = true; scene.add(tr);
    for (let b = 0; b < 4; b++) { const br = new T.Mesh(new T.CylinderGeometry(0.04, 0.08, 2.0, 6), bark), a = b * 1.57 + i; br.position.set(x + Math.cos(a) * 0.55, 4.3, z + Math.sin(a) * 0.55); br.rotation.set(Math.sin(a) * 0.6, 0, -Math.cos(a) * 0.6); br.castShadow = true; scene.add(br); }
    for (let k = 0; k < 26; k++) { const a = k * 0.9 + i, y = 0.9 + k * 0.12, r = 0.2 - k * 0.002; bulbs.push([x + Math.cos(a) * r, y, z + Math.sin(a) * r]); }
    canopy(x, z, 5.1, 2.5, 1.7); solid(x, z, 1.3, 1.45); });
  { const im = new T.InstancedMesh(new T.SphereGeometry(0.028, 6, 4), GLOW(3.6, 2.5, 1.1), bulbs.length), d = new T.Object3D(); bulbs.forEach((b, i) => { d.position.set(...b); d.updateMatrix(); im.setMatrixAt(i, d.matrix); }); im.frustumCulled = false; scene.add(im); }   // warm fairy lights wound up each trunk

  // ── street furniture: lamps and one lantern string, bollards, a YouBike dock, scooters, planters, a coffee cart ──
  const lampPost = get(core, 'lamp'), bollard = get(core, 'bollard'), props = get(core, 'props'), scooters = get(sq, 'sq-scooter'), planter = get(sq, 'sq-planter');
  [[-14.5, 18.4, 1], [14.5, 18.4, -1], [-15, -16.5, 1], [15, -16.5, -1], [-70, -21.5, 0], [-44, -21.5, 0], [44, -21.5, 0], [70, -21.5, 0]].forEach(([x, z, f]) => { const l = dress(lampPost.clone()); l.position.set(x, 0, z); l.rotation.y = f ? f * Math.PI / 2 : Math.PI; l.scale.setScalar(1.2); scene.add(l); });
  lanternString(new T.Vector3(-14.5, 6.2, 18.4), new T.Vector3(14.5, 6.2, 18.4), 1.3); E.buildLanterns();    // the one string of lanterns, by the way back to the old town

  { const bike = get(props, 'bicycle'), orange = triMat({ color: '#e0892a', tex: TEX.metal, scale: 3, rough: 0.4, metal: 0.3 });           // the YouBike dock
    for (let i = 0; i < 7; i++) { if (i === 4) continue; const b = dress(bike.clone(), { swap: { haze: orange } }); b.position.set(15.2, 0, -3.2 + i * 1.05); b.rotation.y = Math.PI / 2 + 0.12; scene.add(b); box(0.12, 0.8, 0.12, steel, 16.1, 0.4, -3.2 + i * 1.05); }

  [[-17.6, -11], [-17.6, 9.2], [-17.6, -1.2], [17.8, 11.5], [17.8, -15.5], [-6.2, 20.6], [6.2, 20.6]].forEach(([x, z], i) => { const p = dress(planter.children[0].clone()); p.position.set(x, 0, z); p.rotation.y = Math.abs(z) > 20 ? 0 : Math.PI / 2; scene.add(p); });

  get(props, 'aboard') && [[-3.6, 8.2, 0.5], [10.6, 14.0, -0.6]].forEach(([x, z, r]) => { const o = dress(get(props, 'aboard').clone()); o.position.set(x, 0, z); o.rotation.y = r; scene.add(o); });

  // ── one showcase per topic of this scene (the list is PHOTO_TOPICS, in photo-topics.js): topic key -> [x, z, facing, kind, options]. A click opens the topic's gallery ──
