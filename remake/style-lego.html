<body>
<canvas id="c"></canvas>
<div id="hud"><b>西門紅樓 · Toy bricks</b><span>Remake test: one block rebuilt as a plastic brick set</span></div>
<div id="keys">W A S D walk · Shift run · H wave · drag to look · scroll to zoom · 1–6 viewpoints · 0 follow</div>
<div id="load">Building the plaza…</div>
<script src="../three.min.js"></script>
<script src="../GLTFLoader.js"></script>
<script src="../meshopt_decoder.js"></script>
<script src="hero.js"></script>
<script>
// Toy bricks remake: the same plaza rebuilt as a plastic brick set (noon sun, studs and seams in world space, brick-built trees, lanterns and clouds).
// Remake test (CJ, 2026-11-21: 「我要整個場景的重制達成風格的轉換 先做完整的一個小區塊讓我看看」).
// One block, the 西門紅樓 front plaza, rebuilt for the "light and air" look: a low sun behind the
// building, real light shafts (marched through the sun's shadow map), haze that shifts from warm
// gold to teal with distance, glow, dust, wet paving. The building shapes come from the project's
// photo-built models; every surface, the ground, the foliage, the lanterns, the stalls, the signs,
// the sky and the whole lighting and finishing chain are new in this file.
(() => {
'use strict';
const T = THREE, QS = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const PR = Math.min(window.devicePixelRatio || 1, 2);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFShadowMap;
renderer.debug.checkShaderErrors = QS.get('debug') === '1';
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(52, 1, 0.1, 500);
const col = (hex) => new T.Color(hex).convertSRGBToLinear();
const R = (() => { let s = 20261121; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; })();
const rr = (a, b) => a + (b - a) * R();

// ── light: clean noon, one hard sun ──────────────────────────────────────────────────────────
const SUN_DIR = new T.Vector3(-38, 58, 22).normalize();            // from the ground toward the sun
const SUN_COL = new T.Color(1.0, 0.98, 0.94);
const sun = new T.DirectionalLight(SUN_COL, 2.6);
sun.position.copy(SUN_DIR).multiplyScalar(130).add(new T.Vector3(0, 0, 22)); sun.target.position.set(0, 0, 22);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.04;
Object.assign(sun.shadow.camera, { left: -62, right: 62, top: 62, bottom: -62, near: 10, far: 260 }); sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);
scene.add(new T.HemisphereLight(new T.Color(0.60, 0.78, 1.0), new T.Color(0.85, 0.74, 0.5), 0.2));

// ── procedural surfaces ──────────────────────────────────────────────────────────────────────
function canvasTex(size, draw, repeat) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size; draw(cv.getContext('2d'), size);
  const t = new T.CanvasTexture(cv); t.wrapS = t.wrapT = T.RepeatWrapping; t.encoding = T.sRGBEncoding; t.anisotropy = 8;
  if (repeat) t.repeat.set(repeat, repeat); return t;
}
const speckle = (g, s, n, a, dark) => { for (let i = 0; i < n; i++) { g.fillStyle = `rgba(${dark ? '0,0,0' : '255,255,255'},${Math.random() * a})`; const r = Math.random() * 3 + 0.5; g.fillRect(Math.random() * s, Math.random() * s, r, r); } };
const TEX = {
  brick: canvasTex(512, (g, s) => {                                   // 1 m of running bond: 4 bricks across, 12 courses
    g.fillStyle = '#b9aa98'; g.fillRect(0, 0, s, s);
    const bw = s / 4, bh = s / 12;
    for (let r = 0; r < 12; r++) for (let c = -1; c < 5; c++) {
      const h = 6 + Math.random() * 12, l = 30 + Math.random() * 16, sa = 52 + Math.random() * 18;
      g.fillStyle = `hsl(${h},${sa}%,${l}%)`; g.fillRect(c * bw + (r % 2) * bw / 2 + 2, r * bh + 2, bw - 4, bh - 4);
    }
    speckle(g, s, 5000, 0.12, true); speckle(g, s, 2500, 0.08, false);
  }),
  plaster: canvasTex(512, (g, s) => {
    g.fillStyle = '#efe6d6'; g.fillRect(0, 0, s, s); speckle(g, s, 9000, 0.07, true);
    for (let i = 0; i < 26; i++) { const x = Math.random() * s, w = 6 + Math.random() * 26, gr = g.createLinearGradient(0, 0, 0, s); gr.addColorStop(0, 'rgba(60,48,36,.22)'); gr.addColorStop(1, 'rgba(60,48,36,0)'); g.fillStyle = gr; g.fillRect(x, 0, w, s * (0.3 + Math.random() * 0.7)); }   // rain streaks
  }),
  concrete: canvasTex(512, (g, s) => { g.fillStyle = '#d6cfc0'; g.fillRect(0, 0, s, s); speckle(g, s, 14000, 0.1, true); speckle(g, s, 5000, 0.1, false); }),
  metal: canvasTex(256, (g, s) => { g.fillStyle = '#e9e9e9'; g.fillRect(0, 0, s, s); for (let i = 0; i < 700; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.08})`; g.fillRect(0, Math.random() * s, s, 1); } }),
  bark: canvasTex(256, (g, s) => { g.fillStyle = '#b8a48c'; g.fillRect(0, 0, s, s); for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(30,20,10,${Math.random() * 0.25})`; g.fillRect(Math.random() * s, 0, 1 + Math.random() * 2, s); } }),
  leafy: canvasTex(256, (g, s) => { g.fillStyle = '#cfd8c0'; g.fillRect(0, 0, s, s); speckle(g, s, 6000, 0.25, true); speckle(g, s, 3000, 0.2, false); }),
};

// Every surface is the same glossy plastic. The models carry no UVs, so the brick pattern is worked
// out from each pixel's place in the WORLD: studs on faces that look up, running-bond brick seams on
// faces that stand, nothing on slopes (slope pieces are smooth). Being world-locked, the pattern
// stays put as the camera moves; each part fades by how many pixels it covers, before it can shimmer.
//   mode 0 bricks · 1 baseplate (tan plaza on a green table, 8x8 plates) · 2 smooth tiles
const ENV_I = 0.45;
function triMat({ color = '#ffffff', gloss = 0.3, emissive = null, eI = 1, mode = 0, pitch = 0.4, fake = 1, vary = 1, studFade = false }) {
  const m = new T.MeshStandardMaterial({ color: col(color), roughness: gloss, metalness: 0, envMapIntensity: ENV_I });
  if (emissive) { m.emissive = col(emissive); m.emissiveIntensity = eI; }
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, { uPitch: { value: pitch }, uMode: { value: mode }, uFake: { value: fake }, uVary: { value: vary }, uSunW: { value: SUN_DIR }, uColA: { value: col('#d4ae64') }, uColB: { value: col('#1f8a3c') } });
    sh.vertexShader = 'varying vec3 vTriPos; varying vec3 vTriN;\n' + sh.vertexShader
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n' + (studFade ? `
      #ifdef USE_INSTANCING
        float sfD = distance(instanceMatrix[3].xyz, cameraPosition), sfK = 1.0 - smoothstep(24.0, 38.0, sfD);
        transformed.y = transformed.y * sfK - (1.0 - sfK) * 0.03;
      #endif` : ''))
      .replace('#include <project_vertex>', `#include <project_vertex>
      vec4 twp = vec4(transformed, 1.0); vec3 tn = objectNormal;
      #ifdef USE_INSTANCING
        twp = instanceMatrix * twp; tn = mat3(instanceMatrix) * tn;
      #endif
      vTriPos = (modelMatrix * twp).xyz; vTriN = normalize(mat3(modelMatrix) * tn);`);
    sh.fragmentShader = `uniform float uPitch, uMode, uFake, uVary; uniform vec3 uSunW, uColA, uColB; varying vec3 vTriPos; varying vec3 vTriN; vec3 legoN = vec3(0.0);
      float lh(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }\n` + sh.fragmentShader
      .replace('#include <map_fragment>', `
        { vec3 wn = normalize(vTriN); float P = uPitch, H = P * 1.2;
          if (uMode > 0.5 && uMode < 1.5) {                                   // baseplates: which plate am I on
            vec2 pid = floor(vTriPos.xz / (P * 8.0) + 1e-4), pc = (pid + 0.5) * P * 8.0;
            vec3 gc = (abs(pc.x) < 25.6 && pc.y > -25.6 && pc.y < 64.0) ? uColA : uColB;
            diffuseColor.rgb *= gc * (0.88 + 0.12 * floor(lh(pid) * 3.0) * 0.5);
          }
          if (wn.y > 0.92) {
            vec2 g = vTriPos.xz / P, fw2 = fwidth(g); float aa = max(fw2.x, fw2.y), fade = 1.0 - smoothstep(0.2, 0.6, aa), ff = fade * uFake;
            if (uMode > 1.5) {                                                // tiles: a groove every two studs
              vec2 t = 0.5 - abs(fract(g * 0.5) - 0.5); float dd = min(t.x, t.y) * 2.0;
              diffuseColor.rgb *= 1.0 - 0.42 * (1.0 - smoothstep(0.035, 0.035 + aa, dd)) * fade;
            } else {                                                          // studs: a disc, the shadow it throws, a turned rim
              vec2 c = fract(g) - 0.5; float r = length(c), disc = 1.0 - smoothstep(0.30 - aa, 0.30 + aa, r);
              vec2 sdir = normalize(uSunW.xz);
              float shd = (1.0 - smoothstep(0.30 - aa, 0.30 + aa, length(c + sdir * 0.11))) * (1.0 - disc);
              diffuseColor.rgb *= (1.0 - 0.45 * shd * ff) * (1.0 + 0.07 * mix(1.0, disc * fade, uFake));
              legoN = vec3(c.x, 0.0, c.y) / max(r, 1e-3) * smoothstep(0.2, 0.3, r) * disc * 0.9 * ff;
              if (uMode > 0.5) { vec2 pe = 0.5 - abs(fract(g / 8.0) - 0.5); diffuseColor.rgb *= 1.0 - 0.3 * (1.0 - smoothstep(0.004, 0.004 + aa / 8.0, min(pe.x, pe.y))) * fade; }
            }
          } else if (abs(wn.y) < 0.5 && uMode < 0.5) {                        // standing faces: 4-stud bricks in running bond
            bool xf = abs(wn.x) > abs(wn.z); float u = xf ? vTriPos.z : vTriPos.x;
            float gy = vTriPos.y / H, row = floor(gy), gx = u / (P * 4.0) + 0.5 * mod(row, 2.0);
            float px = max(fwidth(u), fwidth(vTriPos.y)), w = 0.055 * P;
            float dxm = (0.5 - abs(fract(gx) - 0.5)) * P * 4.0, dym = (0.5 - abs(fract(gy) - 0.5)) * H;
            float farK = 1.0 - smoothstep(0.22, 0.6, px / H), k = min(1.0, 1.8 * w / max(px, 1e-4)) * farK;
            float seam = max(1.0 - smoothstep(w, w + px, dxm), 1.0 - smoothstep(w, w + px, dym));
            diffuseColor.rgb *= 1.0 - 0.5 * seam * k;
            diffuseColor.rgb *= 1.0 + (lh(vec2(floor(gx), row) + (xf ? 17.0 : 0.0)) - 0.5) * 0.14 * uVary * farK;   // no two bricks quite the same batch
            legoN = vec3(0.0, sign(fract(gy) - 0.5), 0.0) * (1.0 - smoothstep(w, w * 3.0, dym)) * k * 0.55;     // rounded brick edges catch the light
          }
        }`)
      .replace('#include <normal_fragment_begin>', '#include <normal_fragment_begin>\n normal = normalize(normal + (viewMatrix * vec4(legoN, 0.0)).xyz);');
  };
  return m;
}
const GLOW = (r, g, b) => new T.MeshBasicMaterial({ color: new T.Color(r, g, b) });
// the whole box of bricks: red, yellow, blue, green, white, black, two greys, tan, brown
const prim = (hue) => { const h = ((hue % 360) + 360) % 360; return h < 20 || h > 330 ? '#c4281c' : h < 70 ? '#f5cd2f' : h < 170 ? '#287f46' : '#0d69ab'; };
const MATS = {
  brick: triMat({ color: '#c4281c' }),
  bone: triMat({ color: '#f2f3f2' }),
  ink: triMat({ color: '#1b1d22', gloss: 0.2, vary: 0.3 }),
  walk: triMat({ color: '#a3a2a4' }),
  haze: triMat({ color: '#0d69ab' }),
  verm: triMat({ color: '#f5cd2f' }),
  lamp: GLOW(1.5, 1.3, 0.6),
  leaf: triMat({ color: '#287f46', pitch: 0.2 }),
  road: triMat({ color: '#635f61' }),
  glass: triMat({ color: '#6ec1e8', gloss: 0.06, vary: 0 }),
};
function dress(node, opts = {}) {
  node.traverse(o => {
    if (!o.isMesh) return;
    const name = o.material && o.material.name; o.material = (opts.swap && opts.swap[name]) || MATS[name] || MATS.walk;
    o.castShadow = !(opts.noCast && opts.noCast.includes(name)); o.receiveShadow = true;
  });
  return node;
}

// ── sky: clear noon blue ─────────────────────────────────────────────────────────────────────
const sky = new T.Mesh(new T.SphereGeometry(400, 48, 24), new T.ShaderMaterial({
  side: T.BackSide, depthWrite: false, uniforms: { uSun: { value: SUN_DIR }, uTime: { value: 0 }, uDisc: { value: 1 } },
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform vec3 uSun; uniform float uTime, uDisc; varying vec3 vD;
    void main(){
      vec3 d = normalize(vD); float up = clamp(d.y, 0.0, 1.0), sd = max(dot(d, uSun), 0.0);
      vec3 c = mix(vec3(0.62, 0.82, 1.05), vec3(0.07, 0.30, 0.86), pow(up, 0.55));          // pale at the horizon, deep blue overhead
      c = mix(c, vec3(0.62, 0.58, 0.44), smoothstep(0.0, -0.12, d.y));                      // what the table throws back up, for reflections
      c += vec3(1.0, 0.97, 0.88) * (pow(sd, 1800.0) * 14.0 * uDisc + pow(sd, 50.0) * 0.12);  // a small hard sun
      gl_FragColor = vec4(c, 1.0);
    }` }));
sky.frustumCulled = false; scene.add(sky);
// the same sky, blurred into a reflection map: this is what makes the plastic look glossy
{ const pm = new T.PMREMGenerator(renderer), es = new T.Scene(); es.add(new T.Mesh(sky.geometry, sky.material));
  sky.material.uniforms.uDisc.value = 0; scene.environment = pm.fromScene(es, 0, 1, 1000).texture; sky.material.uniforms.uDisc.value = 1; pm.dispose(); }

// ── ground: baseplates, with real studs where you walk ───────────────────────────────────────
{
  const P = 0.4;
  const ground = new T.Mesh(new T.PlaneGeometry(480, 480), triMat({ mode: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  // The plaza's studs are geometry (so they keep their edge at walking height); the same grid is
  // painted in the material underneath and takes over where the real ones sink away with distance.
  const sg = new T.CylinderGeometry(0.3 * P, 0.3 * P, 0.07, 10, 1); sg.translate(0, 0.035, 0);
  const cells = []; for (let i = -60; i < 60; i++) for (let j = 21; j < 158; j++) { const x = (i + 0.5) * P, z = (j + 0.5) * P; if (Math.abs(x) < 1.6) continue; cells.push(x, z); }
  const studs = new T.InstancedMesh(sg, triMat({ mode: 1, fake: 0, studFade: true }), cells.length / 2), d = new T.Object3D();
  for (let i = 0; i < cells.length; i += 2) { d.position.set(cells[i], 0, cells[i + 1]); d.updateMatrix(); studs.setMatrixAt(i / 2, d.matrix); }
  studs.receiveShadow = true; studs.frustumCulled = false; scene.add(studs);
  // the way to the door: smooth white tiles, no studs
  const strip = new T.Mesh(new T.BoxGeometry(3.2, 0.05, 60), triMat({ mode: 2, color: '#dfe1e3', gloss: 0.14 }));
  strip.position.set(0, 0.025, 34); strip.receiveShadow = true; scene.add(strip);
}

// ── foliage: thousands of single leaves ──────────────────────────────────────────────────────
const uTime = { value: 0 };
const SWAY = `float ph = instanceMatrix[3].x * 0.9 + instanceMatrix[3].z * 1.3 + instanceMatrix[3].y * 0.7;
  transformed += vec3(sin(uTime * 1.6 + ph), sin(uTime * 2.3 + ph * 1.7) * 0.5, cos(uTime * 1.3 + ph)) * 0.07;`;
const LEAF_A = (() => { const cv = document.createElement('canvas'); cv.width = 64; cv.height = 40; const g = cv.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 64, 40);
  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(2, 20); g.quadraticCurveTo(26, -8, 62, 20); g.quadraticCurveTo(26, 48, 2, 20); g.fill(); return new T.CanvasTexture(cv); })();
function leafField(points, size, casts) {
  const geo = new T.PlaneGeometry(size, size * 0.62);
  const mat = new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.75, side: T.DoubleSide, alphaMap: LEAF_A, alphaTest: 0.5 });
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = uTime; sh.uniforms.uSunV = { value: new T.Vector3() }; mat.userData.sh = sh;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n' + SWAY);
    sh.fragmentShader = 'uniform vec3 uSunV;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>',
      `#include <emissivemap_fragment>
       float back = max(dot(-normalize(vNormal) * (gl_FrontFacing ? 1.0 : -1.0), uSunV), 0.0);
       totalEmissiveRadiance += diffuseColor.rgb * vec3(1.6, 1.25, 0.45) * pow(back, 1.5) * 0.9;`);   // sunlight coming through the leaf
  };
  const im = new T.InstancedMesh(geo, mat, points.length);
  const d = new T.Object3D(), c = new T.Color();
  points.forEach((p, i) => {
    d.position.copy(p); d.rotation.set(rr(-1.2, 1.2), rr(0, 6.28), rr(-1.2, 1.2)); d.scale.setScalar(rr(0.7, 1.35)); d.updateMatrix(); im.setMatrixAt(i, d.matrix);
    c.setHSL(rr(0.21, 0.30), rr(0.4, 0.62), rr(0.09, 0.22)).convertSRGBToLinear(); im.setColorAt(i, c);
  });
  im.castShadow = casts; im.receiveShadow = true; im.frustumCulled = false;
  if (casts) {
    const dm = new T.MeshDepthMaterial({ depthPacking: T.RGBADepthPacking, side: T.DoubleSide, alphaMap: LEAF_A, alphaTest: 0.5 });
    dm.onBeforeCompile = (sh) => { sh.uniforms.uTime = uTime; sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n' + SWAY); };
    im.customDepthMaterial = dm;
  }
  scene.add(im); return im;
}
const leafMats = [];
function canopy(cx, cz, cy, rx, ry) {
  // the crown is built, not grown: 2x2 leaf bricks on the stud grid, with gaps, in three greens
  const S = 0.8, H = 0.48, cells = [], hh = (a, b, c) => { const s = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453; return s - Math.floor(s); };
  for (let i = Math.floor((cx - rx - 1) / S); i <= Math.ceil((cx + rx + 1) / S); i++) for (let k = Math.floor((cz - rx - 1) / S); k <= Math.ceil((cz + rx + 1) / S); k++) for (let j = Math.floor((cy - ry - 1) / H); j <= Math.ceil((cy + ry + 1) / H); j++) {
    const x = i * S + S / 2, y = j * H + H / 2, z = k * S + S / 2, ny = (y - cy) / ry, e = Math.hypot((x - cx) / rx, ny, (z - cz) / rx), n = hh(i, j, k);
    if (ny < -0.5 || e > 0.84 + 0.22 * n || e < 0.45) continue;
    if (e > 0.7 && hh(i + 7, j + 3, k + 5) < 0.16) continue;                // gaps so light gets through
    cells.push([x, y, z, hh(i + 1, j + 9, k + 4)]);
  }
  const im = new T.InstancedMesh(new T.BoxGeometry(S, H, S), triMat({ color: '#ffffff', vary: 0.6 }), cells.length), d = new T.Object3D(), c = new T.Color();
  const G = [col('#1f7a3a'), col('#3f9b3c'), col('#8fc31f')];
  cells.forEach((p, i) => { d.position.set(p[0], p[1], p[2]); d.updateMatrix(); im.setMatrixAt(i, d.matrix); im.setColorAt(i, c.copy(p[3] < 0.62 ? G[0] : p[3] < 0.92 ? G[1] : G[2])); });
  im.castShadow = im.receiveShadow = true; im.frustumCulled = false; scene.add(im);
}

// ── lanterns on strings ──────────────────────────────────────────────────────────────────────
const lanternPts = [];
function lanternString(a, b, sag) {
  const pts = []; const n = Math.max(6, Math.round(a.distanceTo(b) / 0.5));
  for (let i = 0; i <= n; i++) { const t = i / n, p = a.clone().lerp(b, t); p.y -= Math.sin(Math.PI * t) * sag; pts.push(p); }
  scene.add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts), n, 0.03, 5), new T.MeshStandardMaterial({ color: 0x15171a, roughness: 0.3 })));
  const every = Math.max(2, Math.round(1.7 / (a.distanceTo(b) / n)));
  for (let i = every; i < n; i += every) lanternPts.push(pts[i]);
}
function buildLanterns() {
  // each lantern is a round 2x2 brick with a stud on top, between two black round plates
  const n = lanternPts.length, pl = (c, r) => new T.MeshStandardMaterial({ color: c, roughness: r, envMapIntensity: ENV_I });
  const im = new T.InstancedMesh(new T.CylinderGeometry(0.3, 0.3, 0.44, 20), pl(0xffffff, 0.18), n);
  const stud = new T.InstancedMesh(new T.CylinderGeometry(0.12, 0.12, 0.1, 12), pl(0xffffff, 0.18), n);
  const cap = new T.InstancedMesh(new T.CylinderGeometry(0.31, 0.31, 0.07, 20), pl(0x1b1d22, 0.25), n * 2);
  const d = new T.Object3D(), c = new T.Color(), RED = col('#d01712'), YEL = col('#f5cd2f');
  lanternPts.forEach((p, i) => {

window.addEventListener('resize', resize); resize();

const blur = (src, tmp, dst, r) => { blurMat.uniforms.tSrc.value = src.texture; blurMat.uniforms.uDir.value.set(r / tmp.width, 0); draw(blurMat, tmp); blurMat.uniforms.tSrc.value = tmp.texture; blurMat.uniforms.uDir.value.set(0, r / dst.height); draw(blurMat, dst); };

// ── camera: six viewpoints, drag to look, keys to walk ───────────────────────────────────────
const VIEWS = [[0, 1.6, 47, 0, 7.5, 0], [-9, 1.5, 33, 7, 6, 4], [15, 1.3, 36, -8, 6.5, 6], [0, 10, 56, 0, 5, 6], [-11, 1.5, 30, -22, 12, -8], [21, 1.7, 44, -12, 4.5, 14]];
let yaw = 0, pitch = 0; const pos = new T.Vector3(), keys = {};
function setView(i) { const v = VIEWS[i]; pos.set(v[0], v[1], v[2]); const dx = v[3] - v[0], dy = v[4] - v[1], dz = v[5] - v[2]; yaw = Math.atan2(-dx, -dz); pitch = Math.atan2(dy, Math.hypot(dx, dz)); mode = 'fixed'; }
// follow: the camera rides behind the character; fixed: it stands at a viewpoint and she still walks
let mode = 'follow', camYaw = 0, camPitch = 0.13, camDist = 3.4;
const heroPos = new T.Vector3(0, 0, 43), camTarget = new T.Vector3(0, 0.72, 43); let heroHead = Math.PI, heroSpeed = 0, heroTurn = 0;
if (QS.get('view')) setView(Math.max(0, Math.min(5, (parseInt(QS.get('view'), 10) || 1) - 1)));
if (QS.get('close')) { camDist = 1.9; camYaw = Math.PI - 0.5; camPitch = 0.06; }            // ?close=1 looks at her face
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag[0], dy = e.clientY - drag[1]; drag = [e.clientX, e.clientY];
  if (mode === 'follow') { camYaw -= dx * 0.005; camPitch = Math.max(-0.12, Math.min(1.25, camPitch + dy * 0.004)); }
  else { yaw -= dx * 0.0035; pitch = Math.max(-1.2, Math.min(1.35, pitch - dy * 0.0035)); } });
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); camDist = Math.max(1.3, Math.min(11, camDist * (1 + Math.sign(e.deltaY) * 0.08))); }, { passive: false });
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key >= '1' && e.key <= '6') setView(+e.key - 1); if (e.key === '0' || e.key.toLowerCase() === 'f') mode = 'follow'; if (e.key.toLowerCase() === 'h' && hero && hero.wave) hero.wave(); });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ── frame ────────────────────────────────────────────────────────────────────────────────────
const sunV = new T.Vector3(); let last = performance.now(), fpsAcc = 0, fpsN = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000; uTime.value = t; sky.material.uniforms.uTime.value = t;
  const f = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0), sd = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  const fy = mode === 'follow' ? camYaw : yaw, mx = -Math.sin(fy) * f + Math.cos(fy) * sd, mz = -Math.cos(fy) * f - Math.sin(fy) * sd, want = (f || sd) ? (keys.shift ? HERO.RUN : HERO.WALK) : 0;
  let turnRate = 0;
  if (f || sd) { let d = Math.atan2(mx, mz) - heroHead; d = Math.atan2(Math.sin(d), Math.cos(d)); const step = Math.sign(d) * Math.min(Math.abs(d), 7.5 * dt); heroHead += step; turnRate = step / Math.max(dt, 1e-4); }
  heroSpeed += (want - heroSpeed) * Math.min(1, dt * (want > heroSpeed ? 5 : 9)); heroTurn += (turnRate - heroTurn) * Math.min(1, dt * 8);
  heroPos.x = Math.max(-21, Math.min(21, heroPos.x + Math.sin(heroHead) * heroSpeed * dt)); heroPos.z = Math.max(11, Math.min(60, heroPos.z + Math.cos(heroHead) * heroSpeed * dt));
  if (heroPos.z > 59.5 && !window.__leaving) { window.__leaving = true; location.href = 'square.html'; }                 // out of the south end, back to the square
  if (hero) { hero.group.position.copy(heroPos); hero.group.rotation.y = heroHead; hero.update(dt, heroSpeed, heroTurn); }
  if (mode === 'follow') {
    camTarget.lerp(new T.Vector3(heroPos.x, 0.72, heroPos.z), Math.min(1, dt * 7));
    const cp = Math.cos(camPitch); camera.position.set(camTarget.x + Math.sin(camYaw) * cp * camDist, Math.max(0.22, camTarget.y + Math.sin(camPitch) * camDist), camTarget.z + Math.cos(camYaw) * cp * camDist);
    camera.lookAt(camTarget.x, camTarget.y + 0.12 + camDist * 0.08, camTarget.z);
  } else { camera.position.copy(pos); camera.position.y += Math.sin(t * 0.6) * 0.015; camera.rotation.set(pitch, yaw, 0, 'YXZ'); }
  camera.updateMatrixWorld();
  sky.position.copy(camera.position);
  if (false && walker) { const a = t * 0.11; walker.position.set(Math.sin(a) * 6.5, 0, 31 + Math.cos(a) * 9); walker.rotation.y = a + Math.PI / 2; const k = Math.floor(t * 3.4) % 2; walker.children[0].visible = !k; if (walker.children[1]) walker.children[1].visible = !!k; }
  if (lanterns) lanterns.rotation.z = 0;                                                    // (strings are fixed; the leaves carry the wind)
  sunV.copy(SUN_DIR).transformDirection(camera.matrixWorldInverse); leafMats.forEach(m => { if (m.userData.sh) m.userData.sh.uniforms.uSunV.value.copy(sunV); });
  if (steam) steam.material.uniforms.uPx.value = PR;

  renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
  shared.tDepth.value = rtScene.depthTexture; shared.uProjInv.value.copy(camera.projectionMatrixInverse); shared.uCamWorld.value.copy(camera.matrixWorld); shared.uCamPos.value.copy(camera.position);
  if (false && sun.shadow.map) { volMat.uniforms.tShadow.value = sun.shadow.map.texture; volMat.uniforms.uShadowMat.value.copy(sun.shadow.matrix); draw(volMat, rtVol); }
  brightMat.uniforms.tScene.value = rtScene.texture; draw(brightMat, rtB1); blur(rtB1, rtB2, rtB1, 1.6); blur(rtB1, rtB3, rtB4, 2.4); blur(rtB4, rtB3, rtB4, 3.0);
  finalMat.uniforms.tScene.value = rtScene.texture; finalMat.uniforms.tVol.value = rtVol.texture; finalMat.uniforms.tBloomA.value = rtB1.texture; finalMat.uniforms.tBloomB.value = rtB4.texture;
  draw(finalMat, null);
  fpsAcc += dt; fpsN++; if (fpsAcc > 1) { state.fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__remake = Object.assign(state, { setView, VIEWS, renderer, scene, camera, sun, keys, cam(y, p, d) { mode = 'follow'; camYaw = y; camPitch = p; camDist = d; } });
Object.defineProperty(window.__remake, 'hero', { get() { return hero; } });
})();
