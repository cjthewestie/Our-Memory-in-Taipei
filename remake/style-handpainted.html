<script>
// Hand-painted remake (CJ, 2026-11-21: 「這些場景都沒有重做只有套色而已啊」「再給我一個 hand painting 版本」).
// Nothing in this scene comes from the project's building models. The Red House, both shophouse
// rows, the trees, lanterns, stalls, props, ground, sky and far city are all built in this file from
// simple shapes that are bent and leaned on purpose, and every surface is painted on a canvas with
// overlapping brush strokes. Light and shadow are mostly painted in (baked into vertex colours and
// the textures); one soft sun only adds cast shadows. Only the player character is a loaded model.
(() => {
'use strict';
const T = THREE, QS = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const PR = Math.min(window.devicePixelRatio || 1, 2);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.debug.checkShaderErrors = QS.get('debug') === '1';
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(52, 1, 0.1, 600);
const col = (hex) => new T.Color(hex).convertSRGBToLinear();
const hslc = (h, s, l) => new T.Color().setHSL((((h % 360) + 360) % 360) / 360, Math.min(1, Math.max(0, s / 100)), Math.min(1, Math.max(0, l / 100))).convertSRGBToLinear();
const R = (() => { let s = 20261121; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; })();
const rr = (a, b) => a + (b - a) * R(), pick = (a) => a[Math.floor(R() * a.length)];
const lerp = (a, b, t) => a + (b - a) * t, clamp = (x, a, b) => Math.min(b, Math.max(a, x)), sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const h3 = (x, y, z) => { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); };
function vn(x, y, z) {                                                     // smooth 3D noise, 0..1
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z); let fx = x - xi, fy = y - yi, fz = z - zi;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
  return lerp(lerp(lerp(h3(xi, yi, zi), h3(xi + 1, yi, zi), fx), lerp(h3(xi, yi + 1, zi), h3(xi + 1, yi + 1, zi), fx), fy),
    lerp(lerp(h3(xi, yi, zi + 1), h3(xi + 1, yi, zi + 1), fx), lerp(h3(xi, yi + 1, zi + 1), h3(xi + 1, yi + 1, zi + 1), fx), fy), fz);
}

// ── light: gentle. A violet ambient makes the shadows cool, one soft sun makes the light side warm ──
const SUN = new T.Vector3(-0.5, 0.78, 0.52).normalize();
const sun = new T.DirectionalLight(new T.Color(1.0, 0.80, 0.52), 0.72);
sun.position.copy(SUN).multiplyScalar(130).add(new T.Vector3(0, 0, 26)); sun.target.position.set(0, 0, 26);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.06; sun.shadow.radius = 3;
Object.assign(sun.shadow.camera, { left: -62, right: 62, top: 62, bottom: -62, near: 10, far: 260 }); sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target, new T.AmbientLight(new T.Color(0.74, 0.69, 0.82), 1.0));
const FOG = col('#ecd9c2'); scene.fog = new T.Fog(FOG, 55, 250);

// ── the brush: every texture below is made of these strokes ─────────────────────────────────────
const hsl = (h, s, l, a = 1) => `hsla(${(((h % 360) + 360) % 360).toFixed(1)},${clamp(s, 0, 100).toFixed(1)}%,${clamp(l, 0, 100).toFixed(1)}%,${a.toFixed(3)})`;
function brush(g, x, y, len, wid, ang, style, bend = 0) {
  const dx = Math.cos(ang) * len / 2, dy = Math.sin(ang) * len / 2;
  g.strokeStyle = style; g.lineWidth = wid; g.lineCap = 'round'; g.beginPath(); g.moveTo(x - dx, y - dy); g.quadraticCurveTo(x - dy * bend, y + dx * bend, x + dx, y + dy); g.stroke();
}
function daub(g, w, h, n, o) {                                             // n loose strokes around one colour
  for (let i = 0; i < n; i++) {
    const x = rr(o.x0 ?? 0, o.x1 ?? w), y = rr(o.y0 ?? 0, o.y1 ?? h), len = o.len * rr(0.5, 1.4), wid = o.wid * rr(0.6, 1.3), ang = (o.ang || 0) + rr(-1, 1) * (o.av ?? 0.5), bend = rr(-0.5, 0.5);
    const st = hsl(o.h + rr(-1, 1) * (o.dh || 0), o.s + rr(-1, 1) * (o.ds || 0), o.l + rr(-1, 1) * (o.dl || 0), o.a * rr(0.6, 1));
    if (o.wrap) { for (let ox = -w; ox <= w; ox += w) for (let oy = -h; oy <= h; oy += h) { const m = len + wid; if (x + ox > -m && x + ox < w + m && y + oy > -m && y + oy < h + m) brush(g, x + ox, y + oy, len, wid, ang, st, bend); } }
    else brush(g, x, y, len, wid, ang, st, bend);
  }
}
function mkTex(w, h, draw, o = {}) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h);
  const t = new T.CanvasTexture(cv); t.encoding = T.sRGBEncoding; t.anisotropy = 8; if (o.repeat !== false) t.wrapS = t.wrapT = T.RepeatWrapping; return t;
}
const PM = (map, o = {}) => new T.MeshLambertMaterial(Object.assign({ map, vertexColors: true }, o));
const FONT = '700 84px "Kaiti TC","STKaiti","BiauKai","PingFang TC","Heiti TC",sans-serif';

// One wall, painted like a background artist would: loose underpainting, a few bricks picked out,
// grime climbing from the base, shade under the eave, a light edge and a dark edge.
function paintWall(g, w, h, o) {
  const hue = o.hue, sat = o.sat, lit = o.lit, grime = o.grime ?? 1;
  g.fillStyle = hsl(hue, sat, lit); g.fillRect(0, 0, w, h);
  daub(g, w, h, 240, { h: hue, dh: 9, s: sat, ds: 10, l: lit, dl: 8, len: w * 0.22, wid: w * 0.075, ang: -0.35, av: 0.6, a: 0.4 });
  daub(g, w, h, 280, { h: hue + 6, dh: 13, s: sat, ds: 12, l: lit + 2, dl: 10, len: w * 0.12, wid: w * 0.03, ang: -0.2, av: 0.8, a: 0.3 });
  const cluster = (bw, bh, bh0, bs, bl, n) => { const c0 = Math.floor(rr(0, w / bw)), r0 = Math.floor(rr(0, h / bh));
    for (let k = 0; k < n; k++) { const r = r0 + Math.floor(rr(0, 4)), c = c0 + Math.floor(rr(0, 3)); brush(g, (c + (r % 2) * 0.5 + 0.5) * bw, (r + 0.5) * bh, bw * 0.68, bh * 0.62, rr(-0.05, 0.05), hsl(bh0 + rr(-8, 14), bs + rr(-10, 10), bl + rr(-12, 16), 0.8)); } };
  if (o.kind === 'brick') {
    const bw = w / 7, bh = bw * 0.42;
    for (let r = 0; r * bh < h; r++) brush(g, w / 2, r * bh + rr(-2, 2), w * 1.1, 1.8, rr(-0.012, 0.012), hsl(hue + 16, sat * 0.5, lit + 22, 0.16), rr(-0.02, 0.02));
    for (let c = 0; c < 22; c++) cluster(bw, bh, hue, sat, lit, 2 + Math.floor(rr(0, 7)));
  } else if (o.kind === 'plaster') {
    for (let c = 0; c < 2; c++) { const px = rr(w * 0.1, w * 0.9), py = rr(h * 0.15, h * 0.85); daub(g, w, h, 14, { x0: px - 46, x1: px + 46, y0: py - 30, y1: py + 30, h: 30, s: 25, l: lit - 20, dl: 5, len: 40, wid: 26, a: 0.5, av: 2 });
      for (let k = 0; k < 9; k++) brush(g, px + rr(-40, 40), py + Math.round(rr(-2, 2)) * 15, 30, 10, rr(-0.06, 0.06), hsl(12 + rr(-6, 10), 55, 44 + rr(-8, 10), 0.85)); }
    for (let c = 0; c < 3; c++) { let x = rr(0, w), y = rr(0, h * 0.5); g.strokeStyle = hsl(hue - 10, sat, lit - 26, 0.5); g.lineWidth = 1.6; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 7; k++) { x += rr(-16, 16); y += rr(8, 26); g.lineTo(x, y); } g.stroke(); }
    daub(g, w, h, 14, { y0: 0, y1: h * 0.5, h: hue - 20, s: sat * 0.6, l: lit - 20, dl: 4, len: h * 0.3, wid: w * 0.012, ang: 1.57, av: 0.05, a: 0.16 });   // rain drips
  } else {                                                                 // small wall tiles
    const tw = w / 14; for (let i = 1; i < 14; i++) { brush(g, i * tw + rr(-2, 2), h / 2, h * 1.1, 1.4, 1.5708 + rr(-0.01, 0.01), hsl(hue, sat * 0.5, lit - 16, 0.2)); brush(g, w / 2, i * tw + rr(-2, 2), w * 1.1, 1.4, rr(-0.01, 0.01), hsl(hue, sat * 0.5, lit - 16, 0.2)); }
    for (let k = 0; k < 46; k++) { const c = Math.floor(rr(0, 14)), r = Math.floor(rr(0, 14)); brush(g, (c + 0.5) * tw, (r + 0.5) * tw, tw * 0.3, tw * 0.62, rr(-0.1, 0.1), hsl(hue + rr(-14, 14), sat + rr(-8, 14), lit + rr(-12, 14), 0.7)); }
  }
  daub(g, w, h, 40, { y0: h * 0.1, y1: h * 0.6, h: 45, s: 75, l: 88, dl: 5, len: w * 0.25, wid: w * 0.06, ang: -0.4, av: 0.4, a: 0.1 });       // sun scumble
  const gr = g.createLinearGradient(0, h, 0, h * 0.72); gr.addColorStop(0, `rgba(48,34,62,${0.62 * grime})`); gr.addColorStop(1, 'rgba(48,34,62,0)'); g.fillStyle = gr; g.fillRect(0, h * 0.72, w, h * 0.28);
  daub(g, w, h, 70 * grime, { y0: h * 0.86, y1: h, h: 265, s: 22, l: 22, dl: 6, len: h * 0.1, wid: w * 0.03, ang: 1.57, av: 0.25, a: 0.24 });
  daub(g, w, h, 18 * grime, { y0: h * 0.94, y1: h, h: 95, s: 38, l: 36, dl: 6, len: w * 0.05, wid: w * 0.02, ang: 0, av: 1, a: 0.4 });           // moss
  const g2 = g.createLinearGradient(0, 0, 0, h * 0.1); g2.addColorStop(0, 'rgba(44,38,86,.42)'); g2.addColorStop(1, 'rgba(44,38,86,0)'); g.fillStyle = g2; g.fillRect(0, 0, w, h * 0.1);
  daub(g, w, h, 26, { x0: 0, x1: w * 0.025, h: 45, s: 60, l: 92, len: h * 0.12, wid: w * 0.014, ang: 1.57, av: 0.08, a: 0.45 });
  daub(g, w, h, 26, { x0: w * 0.975, x1: w, h: 262, s: 25, l: 22, len: h * 0.12, wid: w * 0.014, ang: 1.57, av: 0.08, a: 0.32 });
}

// ── the shared painted surfaces (these tile; colour comes from the brush and from each object's own tint) ──
const TEX = {
  paint: mkTex(512, 512, (g, w, h) => { g.fillStyle = hsl(40, 12, 86); g.fillRect(0, 0, w, h);
    daub(g, w, h, 420, { h: 40, dh: 40, s: 12, ds: 8, l: 86, dl: 8, len: 120, wid: 42, ang: -0.5, av: 0.6, a: 0.38, wrap: true });
    daub(g, w, h, 480, { h: 30, dh: 60, s: 12, ds: 8, l: 84, dl: 11, len: 64, wid: 15, ang: -0.3, av: 0.9, a: 0.28, wrap: true });
    daub(g, w, h, 200, { h: 50, s: 30, l: 97, len: 80, wid: 3, ang: -0.5, av: 0.5, a: 0.3, wrap: true }); }),
  brick: mkTex(512, 512, (g, w, h) => { g.fillStyle = hsl(11, 58, 40); g.fillRect(0, 0, w, h);
    daub(g, w, h, 300, { h: 11, dh: 8, s: 58, ds: 10, l: 40, dl: 7, len: 110, wid: 40, ang: -0.3, av: 0.6, a: 0.4, wrap: true });
    const bw = w / 6, bh = h / 16; for (let r = 0; r < 16; r++) for (let c = -1; c < 7; c++) if (R() < 0.42) brush(g, (c + (r % 2) * 0.5 + 0.5) * bw + rr(-3, 3), (r + 0.5) * bh + rr(-1.5, 1.5), bw * 0.68, bh * 0.62, rr(-0.05, 0.05), hsl(8 + rr(-6, 16), 58 + rr(-12, 10), 42 + rr(-12, 17), 0.75));
    daub(g, w, h, 120, { h: 30, s: 60, l: 78, len: 50, wid: 3, ang: 0, av: 0.2, a: 0.22, wrap: true }); }),
  quoin: mkTex(256, 256, (g, w, h) => { for (let b = 0; b < 4; b++) { const red = b % 2 === 0; g.fillStyle = red ? hsl(10, 58, 42) : hsl(42, 45, 86); g.fillRect(0, b * 64, w, 64);
      daub(g, w, h, 60, { y0: b * 64 + 8, y1: b * 64 + 56, h: red ? 10 : 42, dh: 8, s: red ? 58 : 40, ds: 10, l: red ? 42 : 86, dl: 8, len: 70, wid: 18, ang: 0, av: 0.15, a: 0.45, wrap: true });
      brush(g, w / 2, b * 64 + 2, w * 1.2, 4, 0, hsl(270, 25, 28, 0.4)); brush(g, w / 2, b * 64 + 8, w * 1.2, 2.5, 0, hsl(48, 80, 94, 0.45)); } }),
  roof: mkTex(256, 256, (g, w, h) => { g.fillStyle = hsl(188, 24, 30); g.fillRect(0, 0, w, h); const cw = w / 8, rh = h / 8;
    for (let r = 0; r < 8; r++) { for (let c = -1; c < 9; c++) { const x = (c + (r % 2) * 0.5 + 0.5) * cw, y = (r + 0.5) * rh; brush(g, x, y, rh * 0.62, cw * 0.74, 1.5708 + rr(-0.08, 0.08), hsl(182 + rr(-12, 22), 26 + rr(-8, 10), 36 + rr(-9, 12), 0.92)); brush(g, x - cw * 0.16, y - rh * 0.2, rh * 0.3, 3, 1.5708, hsl(170, 40, 70, 0.4)); }
      brush(g, w / 2, (r + 1) * rh - 1, w * 1.2, 4, 0, hsl(215, 35, 15, 0.6)); } }),
  paving: mkTex(1024, 1024, (g, w, h) => { g.fillStyle = hsl(18, 24, 32); g.fillRect(0, 0, w, h); const rh = h / 8;
    for (let r = 0; r < 8; r++) { let x = -rr(0, 150); const x0 = x; while (x < w + 160) { const bw = rr(70, 210), hue = 24 + rr(-14, 14), sa = 24 + rr(-10, 14), li = 61 + rr(-10, 9), y = r * rh;
        for (let ox = 0; ox >= -w; ox -= w) { const xx = x + ox - x0 * 0 ; g.fillStyle = hsl(hue, sa, li); g.beginPath(); g.moveTo(xx + 5 + rr(-2, 2), y + 5 + rr(-2, 2)); g.lineTo(xx + bw - 5 + rr(-2, 2), y + 5 + rr(-2, 2)); g.lineTo(xx + bw - 5 + rr(-2, 2), y + rh - 5 + rr(-2, 2)); g.lineTo(xx + 5 + rr(-2, 2), y + rh - 5 + rr(-2, 2)); g.closePath(); g.fill();
          for (let k = 0; k < 4; k++) brush(g, xx + bw * rr(0.25, 0.75), y + rh * rr(0.25, 0.75), bw * 0.5, rh * 0.26, rr(-0.3, 0.3), hsl(hue + rr(-8, 8), sa, li + rr(-7, 8), 0.4));
          brush(g, xx + bw / 2, y + 9, bw * 0.8, 3, 0, hsl(45, 60, 90, 0.35)); }
        x += bw; if (x > w && x - bw < w) break; } }
    daub(g, w, h, 260, { h: 20, dh: 30, s: 25, l: 50, dl: 14, len: 220, wid: 60, ang: 0.3, av: 1, a: 0.07, wrap: true });
    daub(g, w, h, 300, { h: 270, s: 20, l: 28, len: 14, wid: 6, av: 3, a: 0.16, wrap: true }); }),
  path: mkTex(512, 512, (g, w, h) => { g.fillStyle = hsl(30, 26, 44); g.fillRect(0, 0, w, h); const rh = h / 4;
    for (let r = 0; r < 4; r++) { const n = 2 + (r % 2), bw = w / n, off = r % 2 ? bw * 0.4 : 0; for (let c = -1; c <= n; c++) { const x = c * bw + off, y = r * rh, hue = 38 + rr(-10, 8), li = 80 + rr(-6, 6);
        g.fillStyle = hsl(hue, 34, li); g.beginPath(); g.moveTo(x + 6, y + 6 + rr(-2, 2)); g.lineTo(x + bw - 6, y + 6 + rr(-2, 2)); g.lineTo(x + bw - 6 + rr(-2, 2), y + rh - 6); g.lineTo(x + 6 + rr(-2, 2), y + rh - 6); g.closePath(); g.fill();
        for (let k = 0; k < 7; k++) brush(g, x + bw * rr(0.2, 0.8), y + rh * rr(0.2, 0.8), bw * 0.4, rh * 0.22, rr(-0.4, 0.4), hsl(hue + rr(-10, 10), 34, li + rr(-7, 7), 0.4)); } }
    daub(g, w, h, 60, { h: 280, s: 20, l: 40, len: 20, wid: 5, av: 3, a: 0.14, wrap: true }); }),
  leaf: mkTex(512, 512, (g, w, h) => { g.fillStyle = hsl(95, 30, 70); g.fillRect(0, 0, w, h);
    daub(g, w, h, 1000, { h: 95, dh: 28, s: 38, ds: 15, l: 72, dl: 20, len: 30, wid: 16, av: 3.2, a: 0.62, wrap: true });
    daub(g, w, h, 320, { h: 70, dh: 15, s: 60, l: 94, dl: 4, len: 22, wid: 10, av: 3.2, a: 0.55, wrap: true });
    daub(g, w, h, 240, { h: 160, dh: 20, s: 40, l: 40, dl: 6, len: 22, wid: 10, av: 3.2, a: 0.42, wrap: true }); }),
  bark: mkTex(256, 256, (g, w, h) => { g.fillStyle = hsl(26, 26, 62); g.fillRect(0, 0, w, h);
    daub(g, w, h, 260, { h: 26, dh: 14, s: 26, ds: 10, l: 62, dl: 18, len: 110, wid: 13, ang: 1.5708, av: 0.16, a: 0.5, wrap: true });
    daub(g, w, h, 60, { h: 45, s: 50, l: 92, len: 70, wid: 4, ang: 1.5708, av: 0.12, a: 0.4, wrap: true }); daub(g, w, h, 60, { h: 280, s: 25, l: 24, len: 80, wid: 4, ang: 1.5708, av: 0.12, a: 0.4, wrap: true }); }),
  wood: mkTex(256, 256, (g, w, h) => { g.fillStyle = hsl(32, 40, 72); g.fillRect(0, 0, w, h);
    daub(g, w, h, 200, { h: 32, dh: 10, s: 40, ds: 10, l: 72, dl: 12, len: 120, wid: 14, ang: 0, av: 0.06, a: 0.5, wrap: true });
    for (let i = 0; i < 4; i++) { brush(g, w / 2, i * 64 + 3, w * 1.2, 4, 0, hsl(15, 40, 22, 0.7)); brush(g, w / 2, i * 64 + 9, w * 1.2, 2.5, 0, hsl(45, 70, 94, 0.5)); } }),
  farwall: mkTex(256, 256, (g, w, h) => { g.fillStyle = hsl(30, 14, 84); g.fillRect(0, 0, w, h);
    daub(g, w, h, 160, { h: 30, dh: 40, s: 14, l: 84, dl: 7, len: 100, wid: 34, ang: -0.4, av: 0.6, a: 0.4, wrap: true });
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (R() < 0.8) brush(g, (c + 0.5) * 64 + rr(-3, 3), (r + 0.5) * 64 + rr(-3, 3), 26, 20, 1.5708, hsl(225 + rr(-15, 15), 26, 50 + rr(-8, 14), 0.6)); }),
  lantern: mkTex(256, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#c9b8a4'); gr.addColorStop(0.42, '#fffbea'); gr.addColorStop(0.62, '#fff3d2'); gr.addColorStop(1, '#a8948a'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    daub(g, w, h, 120, { h: 40, s: 30, l: 88, dl: 8, len: 60, wid: 16, ang: 1.5708, av: 0.2, a: 0.3, wrap: true });
    for (let i = 0; i < 16; i++) brush(g, i * 16 + 8, h / 2, h * 1.1, 2.2, 1.5708, hsl(15, 40, 35, 0.4));
