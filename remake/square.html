<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remake test · The lantern square, golden hour</title>
</head>
<body>
<script src="../three.min.js"></script>
<script src="../GLTFLoader.js"></script>
<script src="../meshopt_decoder.js"></script>
<script src="hero.js"></script>
<script src="engine.js"></script>
<script>
// The hub square: three gates, forty years. Only this block's layout lives here. The light, sky,
// ground, builders, finishing chain, camera and controls are in engine.js, shared with every block page.
const H = 19.5;                                                  // centre to the arcade fronts
const inGate = (a, b) => Math.abs(b) < 3.4 && Math.abs(a) > 13;  // a gate's opening lets her past the wall line
ENGINE.create({
  title: '廣場 · The Square', subtitle: 'Three gates, forty years. Walk through one.',
  shadowCenter: [0, 0, 0], start: { x: 0, z: 11.5, heading: Math.PI },
  views: [[0, 1.5, 16.5, 0, 4.5, 0], [7, 1.4, 6, -17, 5, -1.5], [-5.5, 1.3, 4, 3, 6, -18], [0, 12, 24, 0, 2.5, 0], [-10, 1.4, -9, -21, 10, -18], [-3, 1.5, 14.5, 9.5, 2.2, 9]],
  ground: { strips: [{ w: 2.8, len: 37 }, { w: 2.8, len: 37, turn: true }],               // a terrazzo cross, gate to gate
    puddle: (rr) => { let x = rr(-14, 14); if (Math.abs(x) < 2.4) x += 5; let z = rr(-14, 14); if (Math.abs(z) < 2.4) z += 5; return [x, z, rr(0, 3)]; } },
  dust: { x: [-18, 18], y: [0.3, 9], z: [-18, 18] },
  clamp(p) {
    p.x = Math.max(inGate(p.x, p.z) ? -18.8 : -16, Math.min(inGate(p.x, p.z) ? 18.8 : 16, p.x));
    p.z = Math.max(inGate(p.z, p.x) && p.z < 0 ? -18.8 : -16, Math.min(13.6, p.z));       // stops short of the scooters parked along the south arcade
    const cr = Math.hypot(p.x, p.z); if (cr < 2.7) { p.x *= 2.7 / Math.max(cr, 1e-3); p.z *= 2.7 / Math.max(cr, 1e-3); }   // walk round the centre stone
  },
  onFrame(E) { const p = E.heroPos;
    if (p.x < -18) E.leave('index.html?from=square', '西門町 · 1985–1999', 700);
    else if (p.z < -18) E.leave('dadao.html?from=square', '大稻埕 · 2000–2019', 700); else if (p.x > 18) E.leave('xinyi.html?from=square', '信義 · 2020–', 700); },
  models: ['bundle-core', 'bundle-square'],
  build(E, [core, sq]) {
  const { T, scene, rr, TEX, MATS, triMat, dress, get, place, board, sign, canopy, banyans, lanternString, stall, city, uTime } = E;
  // 騎樓 arcades on all four sides, left open where the three gates stand
  const arcade = get(sq, 'sq-arcade'), tints = ['#d8c8ac', '#c9b08c', '#b9a99e', '#a9b5a2', '#c9a583', '#b3ada1'];
  const sides = [[0, 1, Math.PI, false], [0, -1, 0, true], [1, 0, -Math.PI / 2, true], [-1, 0, Math.PI / 2, true]];   // south, north, east, west
  sides.forEach(([nx, nz, ry, gate], si) => { for (let i = 0; i < 9; i++) {
    const t = -18 + i * 4.5; if (gate && Math.abs(t) < 7) continue;
    const a = arcade.clone(); a.position.set(nx ? nx * H : t, 0, nz ? nz * H : t); a.rotation.y = ry;
    dress(a, { swap: { bone: triMat({ color: tints[(i * 5 + si * 2) % tints.length], tex: TEX.plaster, scale: 0.4, rough: 0.85 }) } }); a.scale.y = 1 + ((i * 7 + si) % 3) * 0.16; scene.add(a);
  } });
  // the three gates, each with its name and years, and a glow in the opening that breathes
  const gates = get(sq, 'sq-gate');
  [['ximen', -1, 0, Math.PI / 2, '西門町', 'XIMENDING', '1985–1999', '#b7372a', [3.0, 0.9, 0.4]], ['dadao', 0, -1, 0, '大稻埕', 'DADAOCHENG', '2000–2019', '#8a5a34', [3.0, 1.9, 0.6]], ['xinyi', 1, 0, -Math.PI / 2, '信義', 'XINYI', '2020–', '#1f5e8c', [0.6, 1.9, 3.0]]].forEach(([node, nx, nz, ry, zh, en, years, bg, glow]) => {
    const g = dress(get(gates, node).clone()); g.position.set(nx * (H - 1.2), 0, nz * (H - 1.2)); g.rotation.y = ry; scene.add(g);
    const b = board([[zh, 150, 0.36], [en + '  ' + years, 62, 0.76, 600]], 6.4, 2.0, bg, '#fff3d6', 0.9); b.position.set(nx * (H - 2.4), 8.6, nz * (H - 2.4)); b.rotation.y = ry; scene.add(b);
    const portal = new T.Mesh(new T.PlaneGeometry(7.4, 6.8), new T.ShaderMaterial({ transparent: true, depthWrite: false, side: T.DoubleSide, blending: T.AdditiveBlending, uniforms: { uTime, uCol: { value: new T.Color(...glow) } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: 'uniform float uTime; uniform vec3 uCol; varying vec2 vUv; void main(){ float e = smoothstep(0.0, 0.35, vUv.x) * smoothstep(1.0, 0.65, vUv.x) * smoothstep(1.0, 0.25, vUv.y); gl_FragColor = vec4(uCol * e * (0.32 + 0.12 * sin(uTime * 1.3)), 1.0); }' }));
    portal.position.set(nx * (H - 1.2), 3.4, nz * (H - 1.2)); portal.rotation.y = ry; scene.add(portal);
  });
  // the centre: a terrazzo stone, and the title board on its post
  const stone = triMat({ color: '#b9b2a6', tex: TEX.concrete, scale: 1.2, rough: 0.45 });
  [[2.4, 0.32, 0.16], [1.8, 0.28, 0.46]].forEach(([r, h, y]) => { const c = new T.Mesh(new T.CylinderGeometry(r, r + 0.08, h, 40), stone); c.position.y = y; c.castShadow = c.receiveShadow = true; scene.add(c); });
  const post = new T.Mesh(new T.CylinderGeometry(0.11, 0.13, 3.0, 12), MATS.ink); post.position.y = 2.1;   // stops under the board, so it no longer crosses the lettering post.castShadow = true; scene.add(post);
  const title = board([['我們的台北記憶', 132, 0.38], ['OUR MEMORY IN TAIPEI', 58, 0.76, 600]], 6.8, 2.1, '#f1e7d2', '#2a2420', 0.35); title.position.y = 4.6; scene.add(title);
  // the two photo walls in the south half: the opening exhibition, and the visitors' wall
  const texLoader = new T.TextureLoader();
  const wall = (x, ry, head, sub, frames) => {
    const g = new T.Group(); g.position.set(x, 0, 8.6); g.rotation.y = -ry;
    const w = new T.Mesh(new T.BoxGeometry(8.4, 3.3, 0.32), triMat({ color: '#e9dfca', tex: TEX.plaster, scale: 0.5, rough: 0.9 })); w.position.y = 1.65; w.castShadow = w.receiveShadow = true; g.add(w);
    const hd = board([[head, 84, 0.4], [sub, 40, 0.8, 500]], 8.4, 0.8, '#1f2a44', '#f1e7d2', 0.5, 2048); hd.position.set(0, 3.7, 0); g.add(hd);
    frames.forEach((f, i) => { const fx = (i - (frames.length - 1) / 2) * 2.6;
      const fr = new T.Mesh(new T.BoxGeometry(2.25, 1.95, 0.08), new T.MeshStandardMaterial({ color: 0x3a2a1c, roughness: 0.5 })); fr.position.set(fx, 1.8, 0.19); fr.castShadow = true; g.add(fr);
      let face;
      if (f.img) { const t = texLoader.load('../asset/photos/' + f.img); t.encoding = T.sRGBEncoding; face = new T.Mesh(new T.PlaneGeometry(2.0, 1.35), new T.MeshStandardMaterial({ map: t, roughness: 0.7, emissiveMap: t, emissive: new T.Color(1, 1, 1), emissiveIntensity: 0.18 })); face.position.set(fx, 1.92, 0.235); }
      else { face = board(f.add ? [['＋', 250, 0.42], ['Add your photo', 70, 0.8, 600]] : [['', 10, 0.5]], 2.0, 1.7, '#f4ecdb', f.add ? '#b7372a' : '#cdbfa5', 0.2); face.position.set(fx, 1.8, 0.24); }
      g.add(face);
      if (f.cap) { const c = board([[f.cap, 46, 0.5, 500]], 2.0, 0.26, '#f4ecdb', '#3a2a1c', 0.15); c.position.set(fx, 1.05, 0.24); g.add(c); }
    });
    scene.add(g);
  };
  wall(-7.4, 0.34, 'OPENING EXHIBITION', 'Taipei, photographed · credits on each frame', [{ img: 'chunghwa-1961.webp', cap: '中華商場 · 1961' }, { img: 'yongle-2012.webp', cap: '永樂市場 · 2012' }, {}]);
  wall(7.4, -0.34, "你的照片 VISITORS' WALL", 'Photos left by people who walked here', [{ add: true }, {}, {}]);
  banyans(get(sq, 'sq-banyan'), [[-12, -11.5, 'banyanL', 0.9], [12, -12, 'banyanM', 0.95], [-12.5, 13.5, 'banyanM', 0.85], [12.5, 13.8, 'banyanL', 0.85]]);   // banyans in the four corners, single leaves for crowns
  // lamp posts, and lantern strings between them, out to each gate and round the edge
  const lampPost = get(core, 'lamp'), LP = [[-8, -8], [8, -8], [8, 8], [-8, 8]];
  LP.forEach(([x, z], i) => { const l = dress(lampPost.clone()); l.position.set(x, 0, z); l.scale.setScalar(1.55); l.rotation.y = Math.atan2(-x, -z); scene.add(l); });
  const top = (x, z) => new T.Vector3(x, 7.9, z);
  LP.forEach(([x, z], i) => { const n = LP[(i + 1) % 4]; lanternString(top(x, z), top(n[0], n[1]), 1.5); lanternString(top(x, z), new T.Vector3(0, 5.5, 0), 0.9); });
  [[-1, 0], [0, -1], [1, 0]].forEach(([nx, nz]) => { [-1, 1].forEach(k => { const lp = nx ? [nx * 8, k * 8] : [k * 8, nz * 8]; lanternString(top(lp[0], lp[1]), new T.Vector3(nx * (H - 3) + (nx ? 0 : k * 4.5), 7.2, nz * (H - 3) + (nz ? 0 : k * 4.5)), 0.8); }); });
  E.buildLanterns();
  // street life: scooters nose-in along the south arcade, planters at the piers, two stalls, shop signs
  const scooters = get(sq, 'sq-scooter'), planter = get(sq, 'sq-planter');
  for (let i = 0; i < 9; i++) { if (i % 4 === 3) continue; const sc = dress(scooters.children[i % 3].clone()); sc.position.set(-15 + i * 3.7 + rr(-0.5, 0.5), 0, H - 3.6 + rr(-0.3, 0.3)); sc.rotation.y = Math.PI + rr(-0.3, 0.3); scene.add(sc); }
  [[-7.5, -16.5], [7.5, -16.5], [-16.5, -7.5], [-16.5, 7.5], [16.5, -7.5], [16.5, 7.5], [-14, 16.5], [14, 16.5]].forEach(([x, z], i) => { const p = dress(planter.children[i % 2].clone()); p.position.set(x, 0, z); scene.add(p); });
  stall(-13.2, 2.6, 1.3, 8); stall(13.4, -3.2, -1.3, 205);
  const words = ['牛肉麵', '冰果室', '鐘錶行', '理髮廳', '西藥房', '唱片行', '照相館', '皮鞋', '布莊', '金紙店', '豆花', '機車行', '雜貨', '茶莊', '眼鏡', '書局'];
  words.forEach((w, i) => { const side = i % 4, t = -15 + Math.floor(i / 4) * 8.5 + (side % 2) * 3, d = H - 2.5;
    if (side === 0) sign(w, t, 3.7 + (i % 3) * 0.5, d, 0, [4, 210, 38, 150][i % 4], i % 3 === 0);
    else if (side === 1 && Math.abs(t) > 9) sign(w, t, 3.7 + (i % 3) * 0.5, -d, 0, [350, 28, 210, 150][i % 4], i % 3 === 0);
    else if (side === 2 && Math.abs(t) > 9) sign(w, d, 3.7 + (i % 3) * 0.5, t, Math.PI / 2, [4, 150, 38, 210][i % 4], i % 3 === 0);
    else if (side === 3 && Math.abs(t) > 9) sign(w, -d, 3.7 + (i % 3) * 0.5, t, Math.PI / 2, [28, 350, 150, 4][i % 4], i % 3 === 0); });
  // what each gate looks toward, far off in the haze: 萬年大樓 to the west, old blocks to the north, a tall tower to the east
  place(core, 'wannian', -70, 10, Math.PI / 2, 1.3); place(core, 'chunghwa', -52, -30, Math.PI / 2, 1.3); place(core, 'lux', -20, -62, 0, 1.2); place(core, 'chunghwa', 24, -60, 0, 1.3);
  { const tm = triMat({ color: '#7fa3ad', tex: TEX.metal, scale: 0.3, rough: 0.35, metal: 0.3 }), tw = new T.Group();           // a stepped tower, eight flared tiers and a spire
    const base = new T.Mesh(new T.CylinderGeometry(9, 12, 34, 4), tm); base.position.y = 17; tw.add(base);
    for (let i = 0; i < 8; i++) { const seg = new T.Mesh(new T.CylinderGeometry(9.6, 7.6, 11, 4), tm); seg.position.y = 34 + 5.5 + i * 11; tw.add(seg); }
    const cap = new T.Mesh(new T.CylinderGeometry(3, 7, 9, 4), tm); cap.position.y = 126.5; tw.add(cap); const spire = new T.Mesh(new T.CylinderGeometry(0.3, 1.4, 26, 6), tm); spire.position.y = 144; tw.add(spire);
    tw.traverse(o => { if (o.isMesh) { o.rotation.y = Math.PI / 4; o.castShadow = true; } }); tw.position.set(150, 0, 8); scene.add(tw); }
  city(80, 200);
  },
});
</script>
</body>
</html>
