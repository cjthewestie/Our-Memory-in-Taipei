<script>
// ── the square's signs ───────────────────────────────────────────────────────────────────────
// CJ, 2026-11-21: 「每個招牌要根據他的作用跟含義還有真實的招牌去對應」, 「整個專案都是」. Each sign of the hub is built as the real
// sign type it stands for, with a body and not only a face: a carved lacquer 匾額 in a gilt frame, a cinema marquee in a
// steel case ringed with bulbs, a backlit panel on stand-offs, acrylic light boxes on wall brackets, enamelled tin plates
// with rivets, cloth banners that sag on their ties. What each one is for, the reference it follows and how sure that is
// (measured / inferred / guess) is in docs/signage/sources-square.md. Plain words only: no logo, mascot or likeness.
window.SQ_SIGNS = function (E) {
const { T, scene } = E, PI = Math.PI;
const SANS = '"PingFang TC","Heiti TC","Noto Sans TC",system-ui,sans-serif', KAI = '"Kaiti TC","BiauKai","DFKai-SB","KaiTi",' + SANS, WEI = '"Weibei TC",' + KAI, LI = '"Libian TC","Baoli TC",' + KAI, YUAN = '"Yuanti TC",' + SANS, SONG = '"Songti TC","LiSong Pro","PMingLiU",serif';
const std = (c, r = 0.7, m = 0) => new T.MeshStandardMaterial({ color: E.col(c), roughness: r, metalness: m });
const MAT = { case: std('#2a2c30', 0.5, 0.4), steel: std('#b9bcc0', 0.3, 0.7), wood: std('#3a2416', 0.6), lacquer: std('#6e2418', 0.5), gilt: std('#c9a14a', 0.35, 0.6), iron: std('#1c1a18', 0.6, 0.5), rope: std('#cdbb94', 0.9), bamboo: std('#b89a5a', 0.7), alu: std('#3b4046', 0.35, 0.8), red: std('#4a1210', 0.5, 0.2), stone: std('#8e877a', 0.9),
  bulb: E.GLOW(3.6, 2.4, 1.0), led: E.GLOW(1.2, 2.2, 3.0), lamp: E.GLOW(2.2, 1.9, 1.4), glass: new T.MeshStandardMaterial({ color: 0xbfe0ea, roughness: 0.08, metalness: 0.3, transparent: true, opacity: 0.3, depthWrite: false }) };
const UNIT = new T.BoxGeometry(1, 1, 1);
const FONTS = document.fonts && document.fonts.load ? Promise.all(['Weibei TC', 'Kaiti TC', 'Libian TC', 'Yuanti TC', 'Songti TC'].map(f => document.fonts.load('40px "' + f + '"'))) : Promise.resolve();
const tex = (w, h, draw, ppm) => { const cv = document.createElement('canvas'), p = ppm || Math.max(64, Math.min(240, 1000 / Math.max(w, h))); cv.width = Math.round(w * p); cv.height = Math.round(h * p); const g = cv.getContext('2d'); draw(g, cv.width, cv.height);
  const t = new T.CanvasTexture(cv); t.encoding = T.sRGBEncoding; t.anisotropy = 8; FONTS.then(() => { g.setTransform(1, 0, 0, 1, 0, 0); g.shadowBlur = 0; draw(g, cv.width, cv.height); t.needsUpdate = true; }, () => {}); return t; };   // drawn again once the brush fonts are ready
const lum = c => { const k = new T.Color(c); return k.r * 0.3 + k.g * 0.6 + k.b * 0.1; };
const faceMat = (t, glow) => new T.MeshStandardMaterial({ map: t, roughness: 0.6, emissiveMap: t, emissive: new T.Color(1, 1, 1), emissiveIntensity: glow });
const bx = (grp, mat, w, h, d, x, y, z, rz) => { const m = new T.Mesh(UNIT, mat); m.scale.set(w, h, d); m.position.set(x, y, z); if (rz) m.rotation.z = rz; m.castShadow = true; grp.add(m); return m; };
const plane = (grp, mat, w, h, x, y, z, ry) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), mat); m.position.set(x, y, z); m.rotation.y = ry || 0; grp.add(m); return m; };
const faces = (grp, mat, w, h, d, one) => { plane(grp, mat, w, h, 0, 0, d / 2 + 0.004, 0); if (!one) plane(grp, mat, w, h, 0, 0, -d / 2 - 0.004, PI); };
const sp = (g, px) => { if ('letterSpacing' in g) g.letterSpacing = Math.round(px) + 'px'; };
const fit = (g, txt, size, maxW, font, wt) => { g.font = `${wt || 400} ${size}px ${font}`; const mw = g.measureText(txt).width; if (mw > maxW) { size *= maxW / mw; g.font = `${wt || 400} ${size}px ${font}`; } return size; };
const column = (g, txt, cx, y0, y1, size, font, wt) => { const ch = [...txt], cell = (y1 - y0) / ch.length, s = Math.min(size, cell * 0.94); g.font = `${wt || 400} ${s}px ${font}`; ch.forEach((c, i) => g.fillText(c, cx, y0 + cell * (i + 0.5))); };
const grain = (g, W, H, n, rgb, a) => { for (let i = 0; i < n; i++) { g.fillStyle = `rgba(${rgb},${Math.random() * a})`; g.fillRect(Math.random() * W - 40, Math.random() * H, 40 + Math.random() * W * 0.3, 1 + Math.random() * 2); } };
const gold = (g, y, s) => { const gr = g.createLinearGradient(0, y - s / 2, 0, y + s / 2); gr.addColorStop(0, '#fff0c0'); gr.addColorStop(0.5, '#e8c060'); gr.addColorStop(1, '#b98a2e'); return gr; };
const seal = (g, x, y, s, a, b) => { g.save(); g.translate(x, y); g.rotate(-0.05); g.fillStyle = '#b7372a'; g.fillRect(-s / 2, -s / 2, s, s); g.strokeStyle = '#f6ead0'; g.lineWidth = s * 0.05; g.strokeRect(-s * 0.4, -s * 0.4, s * 0.8, s * 0.8); g.fillStyle = '#f6ead0'; g.font = `400 ${s * 0.4}px ${WEI}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(a, 0, -s * 0.19); g.fillText(b, 0, s * 0.22); g.restore(); };
const tag = (grp, w, h, arm) => { grp.userData.size = [w, h]; grp.userData.arm = arm || 0; return grp; };

// 匾額: a lacquer board with carved, gilded brush lettering inside a 回紋 band, a small column of 上款 on the right and a seal on
// the left, held in a raised red-lacquer frame with a gilt bead and gilt corner blocks; iron straps when it hangs
function plaque(text, w, h, o = {}) { const grp = new T.Group(), d = 0.16, r = o.rail || Math.min(0.16, h * 0.085);
  const t = tex(w, h, (g, W, H) => { g.fillStyle = o.bg || '#15100d'; g.fillRect(0, 0, W, H); grain(g, W, H, 240, '255,214,150', 0.05);
    const m = ENGINE.signTrim(g, W, H, { dark: true, trim: '#d9b25a', seed: text, style: 0, ground: o.ground == null ? 2 : o.ground });
    g.textAlign = 'center'; g.textBaseline = 'middle'; const ch = [...text], span = W * (o.span || 0.66), s = Math.min(H * 0.62, span / ch.length * 0.98); g.font = `${o.weight || 400} ${s}px ${o.font || WEI}`;
    g.shadowColor = 'rgba(0,0,0,.75)'; g.shadowBlur = s * 0.05; g.shadowOffsetY = s * 0.045; g.fillStyle = gold(g, H * 0.5, s); ch.forEach((c, i) => g.fillText(c, W / 2 - span / 2 + span / ch.length * (i + 0.5), H * 0.51));
    g.shadowColor = 'rgba(0,0,0,0)'; g.shadowBlur = 0; g.shadowOffsetY = 0; g.fillStyle = '#d9b25a';
    if (o.right) column(g, o.right, W - m * 3.3, H * 0.2, H * 0.8, H * 0.105, KAI);
    if (o.seal) seal(g, m * 3.3, H * 0.7, H * 0.16, o.seal[0], o.seal[1]); }, o.ppm);
  bx(grp, MAT.wood, w, h, d, 0, 0, 0); faces(grp, faceMat(t, o.glow == null ? 0.4 : o.glow), w, h, d, o.oneSide);
  [[0, h / 2 + r / 2, w + 2 * r, r], [0, -h / 2 - r / 2, w + 2 * r, r], [-w / 2 - r / 2, 0, r, h], [w / 2 + r / 2, 0, r, h]].forEach(([x, y, bw, bh]) => bx(grp, MAT.lacquer, bw, bh, d + 0.1, x, y, 0));
  [[0, h / 2 + r * 0.16, w, r * 0.32], [0, -h / 2 - r * 0.16, w, r * 0.32], [-w / 2 - r * 0.16, 0, r * 0.32, h], [w / 2 + r * 0.16, 0, r * 0.32, h]].forEach(([x, y, bw, bh]) => bx(grp, MAT.gilt, bw, bh, d + 0.13, x, y, 0));
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([a, b]) => bx(grp, MAT.gilt, r * 1.12, r * 1.12, d + 0.15, a * (w / 2 + r / 2), b * (h / 2 + r / 2), 0));
  if (o.hang) [-1, 1].forEach(k => { bx(grp, MAT.iron, 0.05, o.hang, 0.03, k * w * 0.32, h / 2 + r + o.hang / 2, 0); bx(grp, MAT.iron, 0.14, 0.05, 0.1, k * w * 0.32, h / 2 + r + 0.02, 0); });
  return tag(grp, w + 2 * r, h + 2 * r); }

// the title of the square: the 匾額 on a timber post with a cradle beam and two braces, and the English name on a brass strip under it
function titleStand() { const grp = new T.Group();
  bx(grp, MAT.stone, 0.62, 0.5, 0.62, 0, 0.84, 0); bx(grp, MAT.wood, 0.26, 2.5, 0.26, 0, 2.05, 0); bx(grp, MAT.wood, 5.4, 0.36, 0.3, 0, 3.2, 0);
  [-1, 1].forEach(k => { bx(grp, MAT.wood, 1.9, 0.14, 0.2, k * 0.95, 2.6, 0, k * 0.56); bx(grp, MAT.gilt, 0.2, 0.2, 0.34, k * 2.72, 3.2, 0); });
  const brass = faceMat(tex(4.6, 0.26, (g, W, H) => { const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#e6c874'); gr.addColorStop(0.5, '#c9a14a'); gr.addColorStop(1, '#a88236'); g.fillStyle = gr; g.fillRect(0, 0, W, H); grain(g, W, H, 120, '255,255,255', 0.08);
    g.strokeStyle = 'rgba(60,35,10,.6)'; g.lineWidth = H * 0.05; g.strokeRect(H * 0.1, H * 0.1, W - H * 0.2, H - H * 0.2); [[H * 0.3, H / 2], [W - H * 0.3, H / 2]].forEach(([x, y]) => { g.fillStyle = '#5a3d14'; g.beginPath(); g.arc(x, y, H * 0.08, 0, 7); g.fill(); });
    g.fillStyle = '#2a1a0a'; g.textAlign = 'center'; g.textBaseline = 'middle'; sp(g, H * 0.16); fit(g, 'OUR MEMORY IN TAIPEI', H * 0.56, W * 0.84, 'Georgia,"Times New Roman",serif', 700); g.fillText('OUR MEMORY IN TAIPEI', W / 2, H * 0.54); sp(g, 0); }, 220), 0.3);
  plane(grp, brass, 4.6, 0.26, 0, 3.2, 0.156, 0); plane(grp, brass, 4.6, 0.26, 0, 3.2, -0.156, PI);
  const p = plaque('台北記憶', 6.6, 2.0, { right: '三門四十年', seal: ['台', '北'], glow: 0.42, ppm: 155 }); p.position.y = 4.55; grp.add(p); scene.add(grp); return grp; }

// The three district gateways (kind B: the site's own furniture, never a name board on two posts). CJ, 2026-11-22: 「反正這些招牌
// 字都是要設計過的 … 這種無聊的招牌絕對不能出現」, 「招牌可以用midjourney生成紋理 或海報更換所有的招牌」. Each gate carries its era as
// three posters in the frame its district would use: the middle one is the district's painting (DESIGN.gateTexture ->
// asset/textures/posters/gates/<district>.jpg) under code lettering, the two beside it are posters of that district's own events
// (their paintings from posters/events/). Until a painting lands the kit's code-drawn poster shows. Sources: docs/signage/designs-square.md.
const GATE = {
  ximen: [{ layout: 'premiere', palette: 'premiere', head: '電影街', big: '首輪', kicker: 'NOW SHOWING', kicker2: '隆重獻映', venue: '武昌街二段', date: '1985', art: 'posters/events/golden-horse-outdoor-2018.jpg' },
    { layout: 'painted', palette: 'painted', head: '西門町', big: '西門町', kicker: 'XIMENDING', kicker2: '電影 · 徒步 · 青春', en: 'XIMENDING  1985–1999', venue: '萬年 · 獅子林 · 紅樓', date: '1985–1999' },
    { layout: 'street', palette: 'street', head: '徒步區', big: '1999', kicker: 'PEDESTRIAN ZONE', kicker2: '假日封街', venue: '漢中街 · 峨嵋街', date: '1999', art: 'posters/events/backstreet-fest-2020.jpg' }],
  dadao: [{ layout: 'deco', palette: 'deco', head: '迪化街', big: '一九二〇', kicker: 'DIHUA STREET', kicker2: '南北貨 · 茶 · 布', venue: '永樂町', date: '2000', art: 'posters/events/tttifa-arts-festival.jpg' },
    { layout: 'market', palette: 'market', head: '大稻埕', big: '大稻埕', kicker: 'DADAOCHENG', kicker2: '年貨 · 碼頭 · 煙火', en: 'DADAOCHENG  2000–2019', venue: '迪化街 · 永樂市場 · 碼頭', date: '2000–2019' },
    { layout: 'memory', palette: 'temple', head: '霞海城隍', big: '迎城隍', kicker: 'CITY GOD', kicker2: '五月十三', venue: '迪化街一段', date: '2019', art: 'posters/events/city-god-procession.jpg' }],
  xinyi: [{ layout: 'nightart', palette: 'nightart', head: '白晝之夜 信義', big: '徹夜', kicker: 'NUIT BLANCHE', kicker2: '18:00 → 06:00', venue: '國父紀念館', date: '2023', art: 'posters/events/nuit-blanche-xinyi-2023.jpg' },
    { layout: 'countdown', palette: 'countdown', head: '信義', big: '2020–', kicker: 'XINYI', kicker2: '倒數 · 夜景 · 天際線', en: 'XINYI  2020–', venue: '市府 · 101 · 信義商圈', date: '2020–' },
    { layout: 'memory', palette: 'memory', head: '誠品信義 最後一夜', big: '最後一夜', kicker: 'LAST NIGHT', kicker2: '書店不打烊', venue: '松高路', date: '2023', art: 'posters/events/eslite-xinyi-last-night-2023.jpg' }],
};
const bulbRow = (grp, pts, r, mat) => { const im = new T.InstancedMesh(new T.SphereGeometry(r, 8, 6), mat, pts.length), M4 = new T.Matrix4(); pts.forEach(([x, y, z], i) => im.setMatrixAt(i, M4.makeTranslation(x, y, z))); grp.add(im); return im; };
function gateway(kind) { const grp = new T.Group(), P = GATE[kind], pw = 1.9, ph = 2.69, gap = kind === 'dadao' ? 0.36 : 0.2, xs = [-(pw + gap), 0, pw + gap], W = 3 * pw + 2 * gap;
  const tex = P.map((d, i) => (window.DESIGN ? (i === 1 ? DESIGN.gateTexture(E, kind, d, 768) : DESIGN.posterTexture(E, null, d, 640)) : null));
  const face = (i, x, z, glow) => { if (tex[i]) plane(grp, faceMat(tex[i], glow), pw, ph, x, 0, z, 0); };
  if (kind === 'ximen') {   // a 1985 cinema front: a red steel case, three hand-painted boards side by side as over the doors, ringed and divided by chaser bulbs
    bx(grp, MAT.red, W + 0.56, ph + 0.56, 0.5, 0, 0, 0); xs.forEach((x, i) => { bx(grp, MAT.case, pw + 0.1, ph + 0.1, 0.04, x, 0, 0.26); face(i, x, 0.285, 0.75); });
    const pts = [], hw = W / 2 + 0.15, hh = ph / 2 + 0.15; for (let x = -hw; x <= hw + 1e-3; x += 0.25) pts.push([x, hh, 0.27], [x, -hh, 0.27]); for (let y = -hh + 0.25; y < hh - 0.1; y += 0.25) pts.push([-hw, y, 0.27], [hw, y, 0.27]);
    [-1, 1].forEach(k => { for (let y = -ph / 2 + 0.1; y < ph / 2; y += 0.22) pts.push([k * (pw / 2 + gap / 2), y, 0.27]); }); bulbRow(grp, pts, 0.05, MAT.bulb);
    bx(grp, MAT.steel, W + 0.7, 0.06, 0.6, 0, ph / 2 + 0.31, 0.05);
    [-1, 1].forEach(k => { const c = cloth(k < 0 ? '冷氣開放' : '隆重獻映', 0.8, 3.4, { vertical: true, bg: k < 0 ? '#b3271e' : '#f3ecd9', fg: k < 0 ? '#ffe14a' : '#b3271e' }); c.position.set(k * 5.0, -3.6, -0.5); grp.add(c); }); }   // hand-painted cloth banners down the piers
  else if (kind === 'dadao') {   // a timber beam strung with red lanterns, the three boards hung under it in red-lacquer frames on iron straps
    const by = ph / 2 + 0.55; bx(grp, MAT.wood, W + 1.2, 0.34, 0.34, 0, by, 0); [-1, 1].forEach(k => bx(grp, MAT.gilt, 0.22, 0.42, 0.42, k * (W / 2 + 0.6), by, 0));
    xs.forEach((x, i) => { const f = 0.09; [[0, ph / 2 + f / 2, pw + 2 * f, f], [0, -ph / 2 - f / 2, pw + 2 * f, f], [-pw / 2 - f / 2, 0, f, ph], [pw / 2 + f / 2, 0, f, ph]].forEach(([fx, fy, w, h]) => bx(grp, MAT.lacquer, w, h, 0.12, x + fx, fy, 0));
      bx(grp, MAT.wood, pw, ph, 0.06, x, 0, -0.01); face(i, x, 0.035, 0.55); [-1, 1].forEach(k => bx(grp, MAT.iron, 0.035, 0.44, 0.035, x + k * pw * 0.36, ph / 2 + 0.3, 0)); });
    const lam = new T.MeshStandardMaterial({ color: E.col('#c8102e'), roughness: 0.7, emissive: E.col('#ff3a1a'), emissiveIntensity: 1.3 }), cap = MAT.gilt;
    for (let i = 0; i < 9; i++) { const x = -W / 2 - 0.4 + i * (W + 0.8) / 8, l = new T.Mesh(new T.SphereGeometry(0.2, 14, 10), lam); l.scale.set(1, 0.85, 1); l.position.set(x, by - 0.42, 0.32); grp.add(l); bx(grp, cap, 0.18, 0.05, 0.18, x, by - 0.24, 0.32); bx(grp, cap, 0.14, 0.04, 0.14, x, by - 0.6, 0.32); bx(grp, MAT.rope, 0.02, 0.2, 0.02, x, by - 0.72, 0.32); }
    [[-1, '南北貨', '#c4261d', '#ffffff'], [1, '茶行', '#f2c12e', '#b3271e']].forEach(([k, txt, bg, fg]) => { const lb = lightbox(txt, { bg, fg, arm: 0.5, w: 0.66, h: txt.length * 0.7 + 0.2 }); lb.rotation.y = -PI / 2; lb.position.set(k * 5.0, -2.6, 0.5 + lb.userData.size[0] / 2 - 0.55); grp.add(lb); }); }
  else {   // 信義: three LED-lit panels in a brushed aluminium frame on steel stand-offs, light lines between them and round the edge, a glass fin at each end
    bx(grp, MAT.alu, W + 0.3, ph + 0.3, 0.14, 0, 0, 0); xs.forEach((x, i) => face(i, x, 0.075, 0.95));
    [1, -1].forEach(k => { bx(grp, MAT.led, W + 0.3, 0.035, 0.05, 0, k * (ph / 2 + 0.17), 0.03).castShadow = false; bx(grp, MAT.led, 0.03, ph, 0.05, k * (pw / 2 + gap / 2), 0, 0.06).castShadow = false; bx(grp, MAT.glass, 0.05, ph + 0.9, 0.6, k * (W / 2 + 0.3), 0, 0.12).castShadow = false; });
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([a, b]) => bx(grp, MAT.steel, 0.08, 0.08, 0.6, a * W * 0.42, b * ph * 0.34, -0.36)); }
  return grp; }

// an acrylic light box: a lit face on both sides of a metal case with a rain cap; upright (直招) or lying (橫招); o.arm hangs it
// off the wall on two square tubes and a stay; o.emblem(g, cx, cy, r) draws a plain picture in the head of the box
function lightbox(text, o = {}) { const v = o.vertical !== false, n = [...text].length, w = o.w || (v ? 0.62 : 0.5 * n + 0.5), h = o.h || (v ? 0.56 * n + (o.emblem ? 0.62 : 0.16) : 0.6), d = o.d || 0.2, grp = new T.Group(), bg = o.bg || '#c4261d', fg = o.fg || '#ffffff';
  const t = tex(w, h, (g, W, H) => { g.fillStyle = bg; g.fillRect(0, 0, W, H); const u = Math.min(W, H), gr = v ? g.createLinearGradient(0, 0, W, 0) : g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, 'rgba(0,0,0,.10)'); gr.addColorStop(0.5, 'rgba(255,255,255,.14)'); gr.addColorStop(1, 'rgba(0,0,0,.12)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.strokeStyle = o.line || fg; g.lineWidth = u * 0.025; g.strokeRect(u * 0.07, u * 0.07, W - u * 0.14, H - u * 0.14); g.textAlign = 'center'; g.textBaseline = 'middle'; let top = u * 0.13, x0 = 0;
    if (o.emblem) { const e = v ? W : H; g.save(); o.emblem(g, e / 2, v ? e * 0.56 : e / 2, e * 0.34); g.restore(); if (v) top = e; else x0 = e * 0.9; }
    g.fillStyle = fg;
    if (v) { column(g, text, W / 2, top, H - u * 0.13 - (o.sub ? H * 0.1 : 0), W * 0.76, o.font || KAI, o.weight || 700); if (o.sub) { fit(g, o.sub, W * 0.2, W * 0.78, SANS, 700); g.fillStyle = o.subFg || fg; g.fillText(o.sub, W / 2, H - u * 0.13 - H * 0.045); } }

<script>
// The hub square: three gates, forty years. Only this block's layout lives here. The light, sky,
// ground, builders, finishing chain, camera and controls are in engine.js, shared with every block page.
const H = 19.5;                                                  // centre to the arcade fronts
const inGate = (a, b) => Math.abs(b) < 3.4 && Math.abs(a) > 13;  // a gate's opening lets her past the wall line
ENGINE.create({
  title: '廣場 · The Square', subtitle: 'Three gates, forty years. Walk through one.',
  shadowCenter: [0, 0, 0], start: { x: 0, z: 11.5, heading: Math.PI },
  views: [[0, 1.5, 16.5, 0, 4.5, 0], [6.6, 1.4, 2.4, -17, 5, -1.5], [-3.4, 1.5, 0.6, 3, 6, -18], [0, 12, 24, 0, 2.5, 0], [-10, 1.4, -9, -21, 10, -18], [-3, 1.5, 14.5, 9.5, 2.2, 9]],
  ground: { strips: [{ w: 2.8, len: 37 }, { w: 2.8, len: 37, turn: true }],               // a terrazzo cross, gate to gate
    puddle: (rr) => { let x = rr(-14, 14); if (Math.abs(x) < 2.4) x += 5; let z = rr(-14, 14); if (Math.abs(z) < 2.4) z += 5; return [x, z, rr(0, 3)]; } },
  dust: { x: [-18, 18], y: [0.3, 9], z: [-18, 18] },

    p.z = Math.max(inGate(p.z, p.x) && p.z < 0 ? -18.8 : -16, Math.min(13.6, p.z));       // stops short of the scooters parked along the south arcade
    const cr = Math.hypot(p.x, p.z); if (cr < 2.7) { p.x *= 2.7 / Math.max(cr, 1e-3); p.z *= 2.7 / Math.max(cr, 1e-3); }   // walk round the centre stone
    PHOTOWALL.keepOut(p);                                                                  // and round the exhibition wall and the topic showcases
  },
  onFrame(E) { const p = E.heroPos;
    if (p.x < -18) E.leave('index.html?from=square', '西門町 · 1985–1999', 700);
    else if (p.z < -18) E.leave('dadao.html?from=square', '大稻埕 · 2000–2019', 700); else if (p.x > 18) E.leave('xinyi.html?from=square', '信義 · 2020–', 700); },
  models: ['bundle-core', 'bundle-square'],

  sides.forEach(([nx, nz, ry, gate], si) => { for (let i = 0; i < 9; i++) {
    const t = -18 + i * 4.5; if (gate && Math.abs(t) < 7) continue;

      let face;
      if (f.img) { const t = texLoader.load('../asset/photos/' + f.img); t.encoding = T.sRGBEncoding; face = new T.Mesh(new T.PlaneGeometry(2.0, 1.35), new T.MeshStandardMaterial({ map: t, roughness: 0.7, emissiveMap: t, emissive: new T.Color(1, 1, 1), emissiveIntensity: 0.18 })); face.position.set(fx, 1.92, 0.235); faces.push({ hit: face, photo: { id: f.img.replace(/\.\w+$/, ''), url: '../asset/photos/' + f.img, caption: f.cap, year: f.year, place: f.place, credit: f.credit } }); }
