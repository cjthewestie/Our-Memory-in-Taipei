<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remake test · 西門紅樓 plaza, Gouache anime</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a5fb0; overflow: hidden; font: 500 13px/1.4 system-ui, sans-serif; color: #f6ead8; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hud { position: fixed; left: 18px; top: 16px; text-shadow: 0 1px 6px rgba(10,30,90,.75); pointer-events: none; }
  #hud b { display: block; font: 700 20px/1.1 system-ui, sans-serif; letter-spacing: .02em; }
  #hud span { opacity: .82; }
  #keys { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: rgba(20,16,14,.6); padding: 8px 14px; border-radius: 999px; backdrop-filter: blur(6px); white-space: nowrap; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; background: #2a5fb0; transition: opacity .8s; }
  #load.gone { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>西門紅樓 · Gouache anime</b><span>Remake test: one block repainted as a summer-noon anime background</span></div>
<div id="keys">W A S D walk · Shift run · H wave · drag to look · scroll to zoom · 1–6 viewpoints · 0 follow</div>
<div id="load">Building the plaza…</div>
<script src="../three.min.js"></script>
<script src="../GLTFLoader.js"></script>
<script src="../meshopt_decoder.js"></script>
<script src="hero.js"></script>
<script>
// STYLE: Gouache anime. Summer noon, cobalt sky with painted cumulus towers, flat poster-paint surfaces,
// three-tone foliage, blue shadows, pale-blue distance, a thin dark-blue contour, strong clean glow.
// Remake test (CJ, 2026-11-21: 「我要整個場景的重制達成風格的轉換 先做完整的一個小區塊讓我看看」).
// One block, the 西門紅樓 front plaza, rebuilt for the "light and air" look: a low sun behind the
// building, real light shafts (marched through the sun's shadow map), haze that shifts from warm
// gold to teal with distance, glow, dust, wet paving. The building shapes come from the project's
// photo-built models; every surface, the ground, the foliage, the lanterns, the stalls, the signs,
// the sky and the whole lighting and finishing chain are new in this file.
(() => {
'use strict';
const T = THREE, QS = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const PR = Math.min(window.devicePixelRatio || 1, 2);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.debug.checkShaderErrors = QS.get('debug') === '1';
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(52, 1, 0.1, 500);
const col = (hex) => new T.Color(hex).convertSRGBToLinear();
const R = (() => { let s = 20261121; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; })();
const rr = (a, b) => a + (b - a) * R();

// ── light ────────────────────────────────────────────────────────────────────────────────────
const SUN_DIR = new T.Vector3(-30, 62, 34).normalize();           // from the ground toward the sun
const SUN_COL = new T.Color(1.0, 0.95, 0.84);
const sun = new T.DirectionalLight(SUN_COL, 2.3);
sun.position.copy(SUN_DIR).multiplyScalar(130).add(new T.Vector3(0, 0, 22)); sun.target.position.set(0, 0, 22);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.radius = 2.2; sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.05;
Object.assign(sun.shadow.camera, { left: -62, right: 62, top: 62, bottom: -62, near: 10, far: 260 }); sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);
scene.add(new T.HemisphereLight(new T.Color(0.36, 0.56, 1.0), new T.Color(0.50, 0.54, 0.80), 1.05));

// ── procedural surfaces ──────────────────────────────────────────────────────────────────────
function canvasTex(size, draw, repeat) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size; draw(cv.getContext('2d'), size);
  const t = new T.CanvasTexture(cv); t.wrapS = t.wrapT = T.RepeatWrapping; t.encoding = T.sRGBEncoding; t.anisotropy = 8;
  if (repeat) t.repeat.set(repeat, repeat); return t;
}
const speckle = (g, s, n, a, dark) => { for (let i = 0; i < n; i++) { g.fillStyle = `rgba(${dark ? '0,0,0' : '255,255,255'},${Math.random() * a})`; const r = Math.random() * 3 + 0.5; g.fillRect(Math.random() * s, Math.random() * s, r, r); } };
const TEX = {
  brick: canvasTex(512, (g, s) => {
    g.fillStyle = '#efc9ae'; g.fillRect(0, 0, s, s);
    const bw = s / 4, bh = s / 12;
    for (let r = 0; r < 12; r++) for (let c = -1; c < 5; c++) {
      const h = 8 + Math.random() * 9, l = 52 + Math.random() * 9, sa = 62 + Math.random() * 14;
      g.fillStyle = `hsl(${h},${sa}%,${l}%)`; g.fillRect(c * bw + (r % 2) * bw / 2 + 2, r * bh + 2, bw - 4, bh - 4);
    }
  }),
  plaster: canvasTex(512, (g, s) => {
    g.fillStyle = '#f6efe2'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 14; i++) { const x = Math.random() * s, w = 10 + Math.random() * 40, gr = g.createLinearGradient(0, 0, 0, s); gr.addColorStop(0, 'rgba(90,110,170,.10)'); gr.addColorStop(1, 'rgba(90,110,170,0)'); g.fillStyle = gr; g.fillRect(x, 0, w, s * (0.3 + Math.random() * 0.7)); }
  }),
  concrete: canvasTex(512, (g, s) => { g.fillStyle = '#ebe6da'; g.fillRect(0, 0, s, s); speckle(g, s, 1500, 0.05, true); }),
  metal: canvasTex(256, (g, s) => { g.fillStyle = '#f0f0f0'; g.fillRect(0, 0, s, s); for (let i = 0; i < 200; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.04})`; g.fillRect(0, Math.random() * s, s, 1); } }),
  bark: canvasTex(256, (g, s) => { g.fillStyle = '#c9b49a'; g.fillRect(0, 0, s, s); for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(40,30,60,${Math.random() * 0.16})`; g.fillRect(Math.random() * s, 0, 1 + Math.random() * 2, s); } }),
  leafy: canvasTex(256, (g, s) => { g.fillStyle = '#cfd8c0'; g.fillRect(0, 0, s, s); speckle(g, s, 6000, 0.25, true); speckle(g, s, 3000, 0.2, false); }),
};

// A lit material textured without UVs: the texture is projected along the three world axes and
// blended by which way the surface faces. The project's models carry no UVs, so this is how they
// take brick, plaster and concrete.
function triMat({ color = '#ffffff', tex = TEX.concrete, scale = 1, rough = 0.85, metal = 0, emissive = null, eI = 1, detail = 0.4 }) {
  const m = new T.MeshStandardMaterial({ color: col(color), roughness: Math.max(rough, 0.7), metalness: 0 });
  if (emissive) { m.emissive = col(emissive); m.emissiveIntensity = eI; }
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTri = { value: tex }; sh.uniforms.uTriScale = { value: scale }; sh.uniforms.uDetail = { value: detail };
    sh.vertexShader = 'varying vec3 vTriPos; varying vec3 vTriN;\n' + sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      vec4 twp = vec4(transformed, 1.0); vec3 tn = objectNormal;
      #ifdef USE_INSTANCING
        twp = instanceMatrix * twp; tn = mat3(instanceMatrix) * tn;
      #endif
      vTriPos = (modelMatrix * twp).xyz; vTriN = normalize(mat3(modelMatrix) * tn);`);
    sh.fragmentShader = `uniform sampler2D uTri; uniform float uTriScale, uDetail; varying vec3 vTriPos; varying vec3 vTriN;
      float pH(float x){ return fract(sin(x) * 43758.5453); }
      float pnz(vec3 p){ vec3 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f); float n = dot(i, vec3(1.0, 57.0, 113.0));
        return mix(mix(mix(pH(n), pH(n+1.0), f.x), mix(pH(n+57.0), pH(n+58.0), f.x), f.y), mix(mix(pH(n+113.0), pH(n+114.0), f.x), mix(pH(n+170.0), pH(n+171.0), f.x), f.y), f.z); }
` + sh.fragmentShader
      .replace('#include <map_fragment>', `
        vec3 bw = pow(abs(normalize(vTriN)), vec3(4.0)); bw /= (bw.x + bw.y + bw.z);
        vec3 tri = texture2D(uTri, vTriPos.zy * uTriScale).rgb * bw.x + texture2D(uTri, vTriPos.xz * uTriScale).rgb * bw.y + texture2D(uTri, vTriPos.xy * uTriScale).rgb * bw.z;
        vec3 triAvg = texture2D(uTri, vTriPos.xz * uTriScale, 10.0).rgb;
        tri = mix(triAvg, tri, uDetail);
        float wash = pnz(vTriPos * 0.21) * 0.62 + pnz(vTriPos * 0.83 + 7.0) * 0.38;      // broad brush wash
        float gy = smoothstep(0.0, 13.0, vTriPos.y);                                      // walls lift toward the top
        vec3 paint = tri * (0.86 + 0.26 * wash) * mix(0.90, 1.10, gy);
        paint = mix(paint, paint * vec3(0.88, 0.96, 1.14), (1.0 - gy) * (1.0 - wash) * 0.45); // cool pools low down
        diffuseColor.rgb *= paint;`)
      .replace('#include <roughnessmap_fragment>', 'float roughnessFactor = roughness;');
  };
  return m;
}
const GLOW = (r, g, b) => new T.MeshBasicMaterial({ color: new T.Color(r, g, b) });   // brighter than white on purpose: it feeds the glow pass
const MATS = {
  brick: triMat({ color: '#fff4ec', tex: TEX.brick, scale: 1.0, rough: 0.95, detail: 0.5 }),
  bone: triMat({ color: '#fbf1dc', tex: TEX.plaster, scale: 0.35, rough: 0.9, detail: 0.5 }),
  ink: triMat({ color: '#34436e', tex: TEX.metal, scale: 2, rough: 0.8, detail: 0.2 }),
  walk: triMat({ color: '#efe4cc', tex: TEX.concrete, scale: 0.5, rough: 0.95 }),
  haze: triMat({ color: '#86addb', tex: TEX.metal, scale: 1.5, rough: 0.8, detail: 0.2 }),
  verm: triMat({ color: '#ee4a30', tex: TEX.concrete, scale: 1, rough: 0.8 }),
  lamp: GLOW(1.5, 1.42, 1.2),
  leaf: triMat({ color: '#4fb543', tex: TEX.leafy, scale: 1.2, rough: 0.95, detail: 0.25 }),
  road: triMat({ color: '#7d8296', tex: TEX.bark, scale: 1.5, rough: 0.97, detail: 0.2 }),
  glass: triMat({ color: '#6fd0f0', tex: TEX.metal, scale: 1, rough: 0.7, detail: 0.2, emissive: '#2a6fb0', eI: 0.35 }),
};
function dress(node, opts = {}) {
  node.traverse(o => {
    if (!o.isMesh) return;
    const name = o.material && o.material.name; o.material = (opts.swap && opts.swap[name]) || MATS[name] || MATS.walk;
    o.castShadow = !(opts.noCast && opts.noCast.includes(name)); o.receiveShadow = true;
  });
  return node;
}

// ── sky ──────────────────────────────────────────────────────────────────────────────────────
const sky = new T.Mesh(new T.SphereGeometry(400, 48, 24), new T.ShaderMaterial({
  side: T.BackSide, depthWrite: false, uniforms: { uSun: { value: SUN_DIR }, uTime: { value: 0 } },
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform vec3 uSun; uniform float uTime; varying vec3 vD;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f); return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
    float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * n(p); p = p * 2.03 + 11.0; a *= 0.5; } return s; }
    float puff(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * abs(2.0 * n(p) - 1.0); p = p * 2.13 + 7.0; a *= 0.5; } return s; }   // round billows with creases between
    // one bank of cumulus: az = angle round the horizon, e = height above it
    vec4 bank(float az, float e, float seed, float tall, float freq){
      float mass = fbm(vec2(az * freq + seed, seed * 1.7));
      float top = 0.05 + smoothstep(0.36, 0.60, mass) * tall;
      vec2 q = vec2(az * 3.4 + seed, e * 5.2 + seed * 0.3);
      float b = puff(q), edge = top * (0.50 + 1.0 * b) - e;
      float cl = smoothstep(0.0, 0.010, edge);
      float bUp = puff(q + vec2(-0.05, 0.16));                                     // the billow above and toward the sun
      float lit = smoothstep(-0.10, 0.07, b - bUp);
      float body = smoothstep(0.03, 0.42, edge / max(top, 0.08));                  // deep in the mass and low down goes to shade
      float shade = clamp(body * 0.85 + (1.0 - lit) * 0.95 - 0.25, 0.0, 1.0);
      shade = floor(shade * 3.0 + 0.5) / 3.0 * 0.7 + shade * 0.3;                  // painted in three or four flat tones
      vec3 cc = mix(vec3(1.70, 1.68, 1.62), vec3(0.44, 0.60, 0.98), shade);
      cc = mix(cc, vec3(0.86, 0.94, 1.06), smoothstep(0.13, 0.0, e));              // bases melt into the pale horizon
      return vec4(cc, cl);
    }
    void main(){
      vec3 d = normalize(vD); float e = d.y, up = clamp(e, 0.0, 1.0), sd = max(dot(d, uSun), 0.0);
      vec3 c = mix(vec3(0.30, 0.62, 1.02), vec3(0.015, 0.12, 0.62), pow(up, 0.46));       // clean gradient: pale at the horizon, deep cobalt overhead
      c = mix(c, vec3(0.72, 0.89, 1.08), pow(1.0 - up, 12.0));
      float az = atan(d.x, -d.z), seam = smoothstep(3.14, 2.7, abs(az));                   // the wrap sits behind the usual views
      vec4 farB = bank(az + uTime * 0.0012, e * 1.35, 31.0, 0.34, 2.3);                     // a lower, paler bank behind
      farB.rgb = mix(farB.rgb, vec3(0.62, 0.82, 1.08), 0.40);
      c = mix(c, farB.rgb, farB.a * seam * step(0.0, e));
      vec4 nearB = bank(az + uTime * 0.002, e, 3.0, 0.92, 1.25);                           // the towers
      c = mix(c, nearB.rgb, nearB.a * seam * step(0.0, e));
      c += vec3(1.0, 0.97, 0.86) * (pow(sd, 1500.0) * 24.0 + pow(sd, 36.0) * 0.30);        // the sun and its halo
      if (e < 0.0) c = vec3(0.84, 0.94, 1.08);
      gl_FragColor = vec4(c, 1.0);
    }` }));
sky.frustumCulled = false; scene.add(sky);

// ── ground: wet brick pavers ─────────────────────────────────────────────────────────────────
{
  const puddles = []; for (let i = 0; i < 34; i++) puddles.push([Math.random(), Math.random(), 0.03 + Math.random() * 0.09]);
  const mk = (kind) => canvasTex(1024, (g, s) => {
    const cols = 16, rows = 32, w = s / cols, h = s / rows;
    g.fillStyle = kind === 'col' ? '#b4a59f' : '#404040'; g.fillRect(0, 0, s, s);
    for (let r = 0; r < rows; r++) for (let c = -1; c <= cols; c++) {
      const x = c * w + (r % 2) * w / 2, y = r * h, v = Math.random();
      g.fillStyle = kind === 'col' ? `hsl(${18 + v * 14},${30 + v * 14}%,${56 + v * 7}%)` : kind === 'bump' ? `rgb(${190 + v * 60},${190 + v * 60},${190 + v * 60})` : `rgb(0,${150 + v * 80},0)`;
      g.fillRect(x + 1.5, y + 1.5, w - 3, h - 3);
    }
    
    if (false) puddles.forEach(([px, py, pr]) => { for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
      const gr = g.createRadialGradient((px + ox) * s, (py + oy) * s, 0, (px + ox) * s, (py + oy) * s, pr * s);
      gr.addColorStop(0, kind === 'col' ? 'rgba(20,16,14,.6)' : 'rgba(0,14,0,1)'); gr.addColorStop(0.7, kind === 'col' ? 'rgba(20,16,14,.45)' : 'rgba(0,18,0,.95)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.beginPath(); g.ellipse((px + ox) * s, (py + oy) * s, pr * s, pr * s * 0.7, 0.6, 0, 7); g.fill(); } });
  }, 66);
  const rough = mk('rough'); rough.encoding = T.LinearEncoding; const bump = mk('bump'); bump.encoding = T.LinearEncoding;
  const ground = new T.Mesh(new T.PlaneGeometry(240, 240), new T.MeshStandardMaterial({ map: mk('col'), roughness: 1, metalness: 0 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const strip = new T.Mesh(new T.PlaneGeometry(3.2, 60), new T.MeshStandardMaterial({ map: canvasTex(512, (g, s) => { g.fillStyle = '#cfc6b4'; g.fillRect(0, 0, s, s); speckle(g, s, 5000, 0.22, true); speckle(g, s, 3000, 0.5, false); }, 1), roughness: 0.95 }));
  for (let i = 0; i < 0; i++) {                                                            // (no puddles at noon) left by the afternoon rain
    const sh = new T.Shape(), n = 9, r0 = rr(0.7, 2.2), ph = rr(0, 6); for (let k = 0; k <= n; k++) { const a = k / n * 6.283, r = r0 * (0.75 + 0.3 * Math.sin(a * 3 + ph) + 0.12 * Math.sin(a * 5 + ph * 2)); k ? sh.lineTo(Math.cos(a) * r, Math.sin(a) * r * 0.62) : sh.moveTo(Math.cos(a) * r, Math.sin(a) * r * 0.62); }
    const pm = new T.Mesh(new T.ShapeGeometry(sh, 6), new T.MeshStandardMaterial({ color: 0x3a2a20, roughness: 0.03, metalness: 0.0, transparent: true, opacity: 0.38 }));
    let x = rr(-19, 19); if (Math.abs(x) < 2.4) x += 5; pm.rotation.set(-Math.PI / 2, 0, rr(0, 3)); pm.position.set(x, 0.006, rr(13, 56)); pm.receiveShadow = true; scene.add(pm);
  }
  strip.material.map.repeat.set(2, 30); strip.rotation.x = -Math.PI / 2; strip.position.set(0, 0.012, 34); strip.receiveShadow = true; scene.add(strip);   // the terrazzo path to the door
}

// ── foliage: thousands of single leaves ──────────────────────────────────────────────────────
const uTime = { value: 0 };
const SWAY = `float ph = instanceMatrix[3].x * 0.9 + instanceMatrix[3].z * 1.3 + instanceMatrix[3].y * 0.7;
  transformed += vec3(sin(uTime * 1.6 + ph), sin(uTime * 2.3 + ph * 1.7) * 0.5, cos(uTime * 1.3 + ph)) * 0.07;`;
const LEAF_A = (() => { const cv = document.createElement('canvas'); cv.width = 64; cv.height = 40; const g = cv.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 64, 40);
  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(2, 20); g.quadraticCurveTo(26, -8, 62, 20); g.quadraticCurveTo(26, 48, 2, 20); g.fill(); return new T.CanvasTexture(cv); })();
function leafField(points, size, casts, tone) {
  const geo = new T.PlaneGeometry(size, size * 0.62);
  const mat = new T.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0, side: T.DoubleSide, alphaMap: LEAF_A, alphaTest: 0.5 });
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = uTime; sh.uniforms.uSunV = { value: new T.Vector3() }; mat.userData.sh = sh;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n' + SWAY);
    sh.fragmentShader = 'uniform vec3 uSunV;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>',
      `#include <emissivemap_fragment>
       float back = max(dot(-normalize(vNormal) * (gl_FrontFacing ? 1.0 : -1.0), uSunV), 0.0);
       totalEmissiveRadiance += diffuseColor.rgb * (vec3(0.34, 0.40, 0.44) + vec3(1.0, 1.15, 0.35) * pow(back, 1.5) * 0.25);`);   // sunlight coming through the leaf
  };
  const im = new T.InstancedMesh(geo, mat, points.length);
  const d = new T.Object3D(), c = new T.Color();
  points.forEach((p, i) => {
    d.position.copy(p); d.rotation.set(rr(-1.2, 1.2), rr(0, 6.28), rr(-1.2, 1.2)); d.scale.setScalar(rr(0.7, 1.35)); d.updateMatrix(); im.setMatrixAt(i, d.matrix);
    const k = tone ? tone(p) : 0.5, band = k > 0.66 ? 2 : k > 0.36 ? 1 : 0;          // three flat greens, as a background painter lays them
    c.setHSL([0.43, 0.36, 0.29][band] + rr(-0.012, 0.012), [0.60, 0.64, 0.68][band], [0.14, 0.26, 0.40][band] + rr(-0.02, 0.02)).convertSRGBToLinear(); im.setColorAt(i, c);
  });
  im.castShadow = casts; im.receiveShadow = true; im.frustumCulled = false;
  if (casts) {
    const dm = new T.MeshDepthMaterial({ depthPacking: T.RGBADepthPacking, side: T.DoubleSide, alphaMap: LEAF_A, alphaTest: 0.5 });
    dm.onBeforeCompile = (sh) => { sh.uniforms.uTime = uTime; sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n' + SWAY); };
    im.customDepthMaterial = dm;
  }
  scene.add(im); return im;
}
const leafMats = [];
function canopy(cx, cz, cy, rx, ry) {
  const cast = [], show = [];
  const pt = () => { const u = R() * 6.283, v = Math.acos(rr(-0.55, 1)), r = Math.cbrt(rr(0.04, 1)); return new T.Vector3(cx + Math.sin(v) * Math.cos(u) * rx * r, cy + Math.cos(v) * ry * r, cz + Math.sin(v) * Math.sin(u) * rx * r); };
  for (let i = 0; i < 3200; i++) cast.push(pt()); for (let i = 0; i < 12000; i++) show.push(pt());
  const lump = (p) => Math.sin(p.x * 1.15 + p.y * 0.9) * Math.sin(p.z * 1.05 - p.y * 0.7 + 1.3);
  const tone = (p) => { const hy = (p.y - cy) / ry, side = ((p.x - cx) * SUN_DIR.x + (p.z - cz) * SUN_DIR.z) / rx; return 0.42 + hy * 0.42 + side * 0.22 + lump(p) * 0.26 + rr(-0.05, 0.05); };
  leafMats.push(leafField(cast, 0.46, true, tone).material, leafField(show, 0.34, false, tone).material);
}

// ── lanterns on strings ──────────────────────────────────────────────────────────────────────
const lanternPts = [];
function lanternString(a, b, sag) {

  renderer.setPixelRatio(PR); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  rtScene.setSize(W, H); rtVol.setSize(W >> 1, H >> 1); rtB1.setSize(W >> 2, H >> 2); rtB2.setSize(W >> 2, H >> 2); rtB3.setSize(W >> 3, H >> 3); rtB4.setSize(W >> 3, H >> 3);

window.addEventListener('resize', resize); resize();
const draw = (mat, target) => { fsTri.material = mat; renderer.setRenderTarget(target); renderer.render(fsScene, fsCam); };
const blur = (src, tmp, dst, r) => { blurMat.uniforms.tSrc.value = src.texture; blurMat.uniforms.uDir.value.set(r / tmp.width, 0); draw(blurMat, tmp); blurMat.uniforms.tSrc.value = tmp.texture; blurMat.uniforms.uDir.value.set(0, r / dst.height); draw(blurMat, dst); };

// ── camera: six viewpoints, drag to look, keys to walk ───────────────────────────────────────
const VIEWS = [[0, 1.6, 47, 0, 7.5, 0], [-9, 1.5, 33, 7, 6, 4], [15, 1.3, 36, -8, 6.5, 6], [0, 10, 56, 0, 5, 6], [-11, 1.5, 30, -22, 12, -8], [21, 1.7, 44, -12, 4.5, 14]];
let yaw = 0, pitch = 0; const pos = new T.Vector3(), keys = {};
function setView(i) { const v = VIEWS[i]; pos.set(v[0], v[1], v[2]); const dx = v[3] - v[0], dy = v[4] - v[1], dz = v[5] - v[2]; yaw = Math.atan2(-dx, -dz); pitch = Math.atan2(dy, Math.hypot(dx, dz)); mode = 'fixed'; }
// follow: the camera rides behind the character; fixed: it stands at a viewpoint and she still walks
let mode = 'follow', camYaw = 0, camPitch = 0.13, camDist = 3.4;
const heroPos = new T.Vector3(0, 0, 43), camTarget = new T.Vector3(0, 0.72, 43); let heroHead = Math.PI, heroSpeed = 0, heroTurn = 0;
if (QS.get('view')) setView(Math.max(0, Math.min(5, (parseInt(QS.get('view'), 10) || 1) - 1)));
if (QS.get('close')) { camDist = 1.9; camYaw = Math.PI - 0.5; camPitch = 0.06; }            // ?close=1 looks at her face
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag[0], dy = e.clientY - drag[1]; drag = [e.clientX, e.clientY];
  if (mode === 'follow') { camYaw -= dx * 0.005; camPitch = Math.max(-0.12, Math.min(1.25, camPitch + dy * 0.004)); }
  else { yaw -= dx * 0.0035; pitch = Math.max(-1.2, Math.min(1.35, pitch - dy * 0.0035)); } });
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); camDist = Math.max(1.3, Math.min(11, camDist * (1 + Math.sign(e.deltaY) * 0.08))); }, { passive: false });
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key >= '1' && e.key <= '6') setView(+e.key - 1); if (e.key === '0' || e.key.toLowerCase() === 'f') mode = 'follow'; if (e.key.toLowerCase() === 'h' && hero && hero.wave) hero.wave(); });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ── frame ────────────────────────────────────────────────────────────────────────────────────
const sunV = new T.Vector3(); let last = performance.now(), fpsAcc = 0, fpsN = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000; uTime.value = t; sky.material.uniforms.uTime.value = t;
  const f = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0), sd = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  const fy = mode === 'follow' ? camYaw : yaw, mx = -Math.sin(fy) * f + Math.cos(fy) * sd, mz = -Math.cos(fy) * f - Math.sin(fy) * sd, want = (f || sd) ? (keys.shift ? HERO.RUN : HERO.WALK) : 0;
  let turnRate = 0;
  if (f || sd) { let d = Math.atan2(mx, mz) - heroHead; d = Math.atan2(Math.sin(d), Math.cos(d)); const step = Math.sign(d) * Math.min(Math.abs(d), 7.5 * dt); heroHead += step; turnRate = step / Math.max(dt, 1e-4); }
  heroSpeed += (want - heroSpeed) * Math.min(1, dt * (want > heroSpeed ? 5 : 9)); heroTurn += (turnRate - heroTurn) * Math.min(1, dt * 8);
  heroPos.x = Math.max(-21, Math.min(21, heroPos.x + Math.sin(heroHead) * heroSpeed * dt)); heroPos.z = Math.max(11, Math.min(60, heroPos.z + Math.cos(heroHead) * heroSpeed * dt));
  if (hero) { hero.group.position.copy(heroPos); hero.group.rotation.y = heroHead; hero.update(dt, heroSpeed, heroTurn); }
  if (mode === 'follow') {
    camTarget.lerp(new T.Vector3(heroPos.x, 0.72, heroPos.z), Math.min(1, dt * 7));
    const cp = Math.cos(camPitch); camera.position.set(camTarget.x + Math.sin(camYaw) * cp * camDist, Math.max(0.22, camTarget.y + Math.sin(camPitch) * camDist), camTarget.z + Math.cos(camYaw) * cp * camDist);
    camera.lookAt(camTarget.x, camTarget.y + 0.12 + camDist * 0.08, camTarget.z);
  } else { camera.position.copy(pos); camera.position.y += Math.sin(t * 0.6) * 0.015; camera.rotation.set(pitch, yaw, 0, 'YXZ'); }
  camera.updateMatrixWorld();
  sky.position.copy(camera.position);
  if (false && walker) { const a = t * 0.11; walker.position.set(Math.sin(a) * 6.5, 0, 31 + Math.cos(a) * 9); walker.rotation.y = a + Math.PI / 2; const k = Math.floor(t * 3.4) % 2; walker.children[0].visible = !k; if (walker.children[1]) walker.children[1].visible = !!k; }
  if (lanterns) lanterns.rotation.z = 0;                                                    // (strings are fixed; the leaves carry the wind)
  sunV.copy(SUN_DIR).transformDirection(camera.matrixWorldInverse); leafMats.forEach(m => { if (m.userData.sh) m.userData.sh.uniforms.uSunV.value.copy(sunV); });
  if (dust) { dust.material.uniforms.uPx.value = PR; steam.material.uniforms.uPx.value = PR; }

  renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
  shared.tDepth.value = rtScene.depthTexture; shared.uProjInv.value.copy(camera.projectionMatrixInverse); shared.uCamWorld.value.copy(camera.matrixWorld); shared.uCamPos.value.copy(camera.position);
  if (sun.shadow.map) { volMat.uniforms.tShadow.value = sun.shadow.map.texture; volMat.uniforms.uShadowMat.value.copy(sun.shadow.matrix); draw(volMat, rtVol); }
  brightMat.uniforms.tScene.value = rtScene.texture; draw(brightMat, rtB1); blur(rtB1, rtB2, rtB1, 1.6); blur(rtB1, rtB3, rtB4, 2.4); blur(rtB4, rtB3, rtB4, 3.0);
  finalMat.uniforms.tScene.value = rtScene.texture; finalMat.uniforms.tVol.value = rtVol.texture; finalMat.uniforms.tBloomA.value = rtB1.texture; finalMat.uniforms.tBloomB.value = rtB4.texture;
  draw(finalMat, null);
  fpsAcc += dt; fpsN++; if (fpsAcc > 1) { state.fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__remake = Object.assign(state, { setView, VIEWS, renderer, scene, camera, sun, keys, cam(y, p, d) { mode = 'follow'; camYaw = y; camPitch = p; camDist = d; } });
Object.defineProperty(window.__remake, 'hero', { get() { return hero; } });
})();
