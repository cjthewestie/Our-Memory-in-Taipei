<style>

  canvas:active { cursor: grabbing; }

  #hud span { opacity: .82; }
  #keys { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: rgba(20,16,14,.6); padding: 8px 14px; border-radius: 999px; backdrop-filter: blur(6px); white-space: nowrap; }

<body>
<canvas id="c"></canvas>
<div id="hud"><b>西門紅樓 · Realistic</b><span>Remake test: the block rebuilt as a late-afternoon photograph</span></div>
<div id="keys">W A S D walk · Shift run · H wave · drag to look · scroll to zoom · 1–6 viewpoints · 0 follow</div>
<div id="load">Building the plaza…</div>
<script src="../three.min.js"></script>
<script src="../GLTFLoader.js"></script>
<script src="../meshopt_decoder.js"></script>
<script src="hero.js"></script>
<script>
// STYLE: REALISTIC. This copy rebuilds the scene as a believable late-afternoon photograph: a neutral
// side sun, sky light taken from the sky itself (image-based ambient), bump + dirt + rain streaks on
// every surface, wet paving with a real mirrored reflection pass, contact shading (AO), a windowed
// far city under plain grey-blue haze, restrained glow, mild lens softness. No gold dust, no teal grade.
// Remake test (CJ, 2026-11-21: 「我要整個場景的重制達成風格的轉換 先做完整的一個小區塊讓我看看」).
// One block, the 西門紅樓 front plaza, rebuilt for the "light and air" look: a low sun behind the
// building, real light shafts (marched through the sun's shadow map), haze that shifts from warm
// gold to teal with distance, glow, dust, wet paving. The building shapes come from the project's
// photo-built models; every surface, the ground, the foliage, the lanterns, the stalls, the signs,
// the sky and the whole lighting and finishing chain are new in this file.
(() => {
'use strict';
const T = THREE, QS = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const PR = Math.min(window.devicePixelRatio || 1, 2);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.debug.checkShaderErrors = QS.get('debug') === '1';
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(52, 1, 0.1, 500);
const col = (hex) => new T.Color(hex).convertSRGBToLinear();
const R = (() => { let s = 20261121; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; })();
const rr = (a, b) => a + (b - a) * R();

// ── light ────────────────────────────────────────────────────────────────────────────────────
const SUN_DIR = new T.Vector3(-40, 27, 18).normalize();           // from the ground toward the sun
const SUN_COL = new T.Color(1.0, 0.91, 0.78);                      // late afternoon, only a little warm
const sun = new T.DirectionalLight(SUN_COL, 5.0);
sun.position.copy(SUN_DIR).multiplyScalar(130).add(new T.Vector3(0, 0, 22)); sun.target.position.set(0, 0, 22);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.05;
Object.assign(sun.shadow.camera, { left: -62, right: 62, top: 62, bottom: -62, near: 10, far: 260 }); sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);
scene.add(new T.HemisphereLight(new T.Color(0.55, 0.62, 0.72), new T.Color(0.36, 0.31, 0.27), 0.22));   // bounce fill only; the sky itself lights the scene (see "sky")

// ── procedural surfaces ──────────────────────────────────────────────────────────────────────
function canvasTex(size, draw, repeat) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size; draw(cv.getContext('2d'), size);
  const t = new T.CanvasTexture(cv); t.wrapS = t.wrapT = T.RepeatWrapping; t.encoding = T.sRGBEncoding; t.anisotropy = 8;
  if (repeat) t.repeat.set(repeat, repeat); return t;
}
const speckle = (g, s, n, a, dark) => { for (let i = 0; i < n; i++) { g.fillStyle = `rgba(${dark ? '0,0,0' : '255,255,255'},${Math.random() * a})`; const r = Math.random() * 3 + 0.5; g.fillRect(Math.random() * s, Math.random() * s, r, r); } };
const TEX = {
  brick: canvasTex(512, (g, s) => {                                   // 1 m of running bond: 4 bricks across, 12 courses
    g.fillStyle = '#c9c0b2'; g.fillRect(0, 0, s, s);
    const bw = s / 4, bh = s / 12;
    for (let r = 0; r < 12; r++) for (let c = -1; c < 5; c++) {
      const h = 8 + Math.random() * 12, l = 26 + Math.random() * 18, sa = 38 + Math.random() * 18;
      g.fillStyle = `hsl(${h},${sa}%,${l}%)`; g.fillRect(c * bw + (r % 2) * bw / 2 + 2, r * bh + 2, bw - 4, bh - 4);
    }
    speckle(g, s, 5000, 0.12, true); speckle(g, s, 2500, 0.08, false);
  }),
  plaster: canvasTex(512, (g, s) => {
    g.fillStyle = '#efe6d6'; g.fillRect(0, 0, s, s); speckle(g, s, 9000, 0.07, true);
    for (let i = 0; i < 26; i++) { const x = Math.random() * s, w = 6 + Math.random() * 26, gr = g.createLinearGradient(0, 0, 0, s); gr.addColorStop(0, 'rgba(60,48,36,.22)'); gr.addColorStop(1, 'rgba(60,48,36,0)'); g.fillStyle = gr; g.fillRect(x, 0, w, s * (0.3 + Math.random() * 0.7)); }   // rain streaks
  }),
  concrete: canvasTex(512, (g, s) => { g.fillStyle = '#d6cfc0'; g.fillRect(0, 0, s, s); speckle(g, s, 14000, 0.1, true); speckle(g, s, 5000, 0.1, false); }),
  metal: canvasTex(256, (g, s) => { g.fillStyle = '#e9e9e9'; g.fillRect(0, 0, s, s); for (let i = 0; i < 700; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.08})`; g.fillRect(0, Math.random() * s, s, 1); } }),
  bark: canvasTex(256, (g, s) => { g.fillStyle = '#b8a48c'; g.fillRect(0, 0, s, s); for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(30,20,10,${Math.random() * 0.25})`; g.fillRect(Math.random() * s, 0, 1 + Math.random() * 2, s); } }),
  leafy: canvasTex(256, (g, s) => { g.fillStyle = '#cfd8c0'; g.fillRect(0, 0, s, s); speckle(g, s, 6000, 0.25, true); speckle(g, s, 3000, 0.2, false); }),
  windows: canvasTex(512, (g, s) => {                                 // 12 m of apartment wall: 4 bays, 4 floors
    g.fillStyle = '#d6d0c6'; g.fillRect(0, 0, s, s); const c = s / 4;
    for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) {
      const x = k * c, y = r * c, v = Math.random();
      g.fillStyle = 'rgba(40,36,30,.28)'; g.fillRect(x, y, c, 5);                                  // floor slab line
      g.fillStyle = '#8f8a82'; g.fillRect(x + 14, y + 26, c - 28, 70);                             // frame
      g.fillStyle = `hsl(${205 + v * 20},${14 + v * 14}%,${9 + v * 16}%)`; g.fillRect(x + 18, y + 30, c - 36, 62);   // glass
      g.fillStyle = '#8f8a82'; g.fillRect(x + c / 2 - 2, y + 30, 4, 62);
      if (Math.random() < 0.4) { g.fillStyle = `hsla(${30 + Math.random() * 30},22%,${55 + Math.random() * 20}%,.8)`; g.fillRect(x + 18, y + 30, (c - 36) * (0.3 + Math.random() * 0.5), 62); }   // a curtain
      if (Math.random() < 0.45) { g.fillStyle = '#a9a8a2'; g.fillRect(x + 22 + Math.random() * 50, y + 96, 30, 20); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(x + 22, y + 116, c - 44, 3); }   // an air conditioner
      const gr = g.createLinearGradient(0, y + 92, 0, y + c); gr.addColorStop(0, 'rgba(50,42,34,.30)'); gr.addColorStop(1, 'rgba(50,42,34,0)'); g.fillStyle = gr; g.fillRect(x + 14, y + 96, c - 28, 30);   // stain under the sill
    }
    speckle(g, s, 6000, 0.08, true);
  }),
};

// A lit material textured without UVs: the texture is projected along the three world axes and
// blended by which way the surface faces. The project's models carry no UVs, so this is how they
// take brick, plaster and concrete.
function triMat({ color = '#ffffff', tex = TEX.concrete, scale = 1, rough = 0.85, metal = 0, emissive = null, eI = 1, bump = 0.012, dirt = 1, roof = false }) {
  const m = new T.MeshStandardMaterial({ color: col(color), roughness: rough, metalness: metal });
  if (emissive) { m.emissive = col(emissive); m.emissiveIntensity = eI; }
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTri = { value: tex }; sh.uniforms.uTriScale = { value: scale }; sh.uniforms.uBump = { value: bump }; sh.uniforms.uDirt = { value: dirt };
    sh.vertexShader = 'varying vec3 vTriPos; varying vec3 vTriN;\n' + sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      vec4 twp = vec4(transformed, 1.0); vec3 tn = objectNormal;
      #ifdef USE_INSTANCING
        twp = instanceMatrix * twp; tn = mat3(instanceMatrix) * tn;
      #endif
      vTriPos = (modelMatrix * twp).xyz; vTriN = normalize(mat3(modelMatrix) * tn);`);
    sh.fragmentShader = `uniform sampler2D uTri; uniform float uTriScale, uBump, uDirt; varying vec3 vTriPos; varying vec3 vTriN; float triL = 0.5; float triD = 0.0;
      float tH(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float tN(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f); return mix(mix(tH(i), tH(i+vec2(1,0)), f.x), mix(tH(i+vec2(0,1)), tH(i+vec2(1,1)), f.x), f.y); }
      float tF(vec2 p){ return tN(p) * 0.5 + tN(p * 2.07 + 13.0) * 0.3 + tN(p * 4.3 + 31.0) * 0.2; }
` + sh.fragmentShader
      .replace('#include <map_fragment>', `
        vec3 bw = pow(abs(normalize(vTriN)), vec3(4.0)); bw /= (bw.x + bw.y + bw.z);
        vec3 tri = texture2D(uTri, vTriPos.zy * uTriScale).rgb * bw.x + texture2D(uTri, vTriPos.xz * uTriScale).rgb * bw.y + texture2D(uTri, vTriPos.xy * uTriScale).rgb * bw.z;
        ${roof ? 'tri = mix(tri, vec3(0.5, 0.49, 0.47), bw.y);' : ''}
        triL = dot(tri, vec3(0.333));
        float tBig = tF(vTriPos.xz * 0.13 + vTriPos.y * 0.09);                                        // patchy weathering
        float tStreak = tF(vec2(dot(vTriPos.xz, vec2(1.9, 1.4)), vTriPos.y * 0.10)) * (1.0 - bw.y);    // rain streaks down the walls
        float tFoot = (1.0 - smoothstep(0.0, 1.0, abs(vTriPos.y))) * (0.45 + 0.55 * tF(vTriPos.xz * 1.1));   // splash dirt where walls meet the ground
        triD = uDirt * clamp(0.5 * smoothstep(0.42, 0.72, tBig) + 0.45 * smoothstep(0.5, 0.8, tStreak) + 0.6 * tFoot, 0.0, 0.8);
        diffuseColor.rgb *= tri; diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(0.46, 0.43, 0.39), triD);`)
      .replace('#include <roughnessmap_fragment>', 'float roughnessFactor = clamp(roughness * (0.55 + 0.9 * triL) + triD * 0.22, 0.05, 1.0);')
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        { vec3 dpx = dFdx(-vViewPosition), dpy = dFdy(-vViewPosition); float hx = dFdx(triL), hy = dFdy(triL);
          vec3 r1 = cross(dpy, normal), r2 = cross(normal, dpx); float det = dot(dpx, r1);
          normal = normalize(abs(det) * normal - sign(det) * uBump * (hx * r1 + hy * r2)); }`);
  };
  return m;
}
const GLOW = (r, g, b) => new T.MeshBasicMaterial({ color: new T.Color(r, g, b) });   // brighter than white on purpose: it feeds the glow pass
const MATS = {
  brick: triMat({ tex: TEX.brick, scale: 1.0, rough: 0.92, bump: 0.03 }),
  bone: triMat({ color: '#d2c8b6', tex: TEX.plaster, scale: 0.35, rough: 0.85, bump: 0.015 }),
  ink: triMat({ color: '#23252d', tex: TEX.metal, scale: 2, rough: 0.34, metal: 0.35, dirt: 0.4, bump: 0.004 }),
  walk: triMat({ color: '#cfc8b8', tex: TEX.concrete, scale: 0.5, rough: 0.92, bump: 0.01 }),
  haze: triMat({ color: '#84909a', tex: TEX.metal, scale: 1.5, rough: 0.5, metal: 0.25, dirt: 0.6, bump: 0.004 }),
  verm: triMat({ color: '#b23a2a', tex: TEX.concrete, scale: 1, rough: 0.6, dirt: 0.6 }),
  lamp: new T.MeshStandardMaterial({ color: 0xe9e6dc, roughness: 0.22 }),                     // daytime: the street lamps are off, just frosted glass
  leaf: triMat({ color: '#3d6a33', tex: TEX.leafy, scale: 1.2, rough: 0.9, dirt: 0 }),
  road: triMat({ color: '#5a544c', tex: TEX.bark, scale: 1.5, rough: 0.97 }),
  glass: triMat({ color: '#5f8f9c', tex: TEX.metal, scale: 1, rough: 0.1, metal: 0.7, dirt: 0.25, bump: 0.0 }),
};
function dress(node, opts = {}) {
  node.traverse(o => {
    if (!o.isMesh) return;
    const name = o.material && o.material.name; o.material = (opts.swap && opts.swap[name]) || MATS[name] || MATS.walk;
    o.castShadow = !(opts.noCast && opts.noCast.includes(name)); o.receiveShadow = true;
  });
  return node;
}

// ── sky ──────────────────────────────────────────────────────────────────────────────────────
const sky = new T.Mesh(new T.SphereGeometry(400, 48, 24), new T.ShaderMaterial({
  side: T.BackSide, depthWrite: false, uniforms: { uSun: { value: SUN_DIR }, uTime: { value: 0 }, uDisc: { value: 1 } },
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform vec3 uSun; uniform float uTime, uDisc; varying vec3 vD;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f); return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
    float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 6; i++) { s += a * n(p); p = p * 2.03 + 11.0; a *= 0.5; } return s; }
    void main(){
      vec3 d = normalize(vD); float up = clamp(d.y, 0.0, 1.0), sd = max(dot(d, uSun), 0.0);
      vec3 c = mix(vec3(0.74, 0.84, 0.96), vec3(0.14, 0.35, 0.78), pow(up, 0.55)) * 0.98;       // pale at the horizon, deeper blue overhead
      c = mix(c, vec3(1.25, 1.18, 1.05), pow(sd, 5.0) * 0.45);                                  // the air whitens around the sun
      vec2 q = d.xz / (d.y + 0.2) * 1.25 + vec2(uTime * 0.003, 0.0);
      float f = fbm(q), cl = smoothstep(0.55, 0.82, f) * smoothstep(0.015, 0.2, d.y);
      float body = smoothstep(0.55, 0.9, fbm(q + uSun.xz * 0.22));                               // thicker toward the far side: shaded bases
      vec3 cc = mix(vec3(1.28, 1.25, 1.2), vec3(0.55, 0.59, 0.67), body * 0.75) + vec3(0.5, 0.45, 0.35) * pow(sd, 3.0);
      c = mix(c, cc, cl * 0.9);
      c += vec3(1.0, 0.93, 0.8) * (pow(sd, 1500.0) * 40.0 + pow(sd, 90.0) * 0.5) * uDisc;       // the sun
      c = mix(c, vec3(0.42, 0.44, 0.47), smoothstep(0.0, -0.06, d.y));                          // below the horizon: hazy ground
      gl_FragColor = vec4(c, 1.0);
    }` }));
// the same sky, blurred into an environment map: it is the ambient light and what shiny things reflect
{ const es = new T.Scene(), em = sky.material.clone(); em.uniforms.uDisc.value = 0; es.add(new T.Mesh(sky.geometry, em));
  const pm = new T.PMREMGenerator(renderer); scene.environment = pm.fromScene(es, 0.02, 1, 1000).texture; pm.dispose(); }
sky.frustumCulled = false; scene.add(sky);

// ── ground: wet brick pavers ─────────────────────────────────────────────────────────────────
// Wet reads as wet only when it mirrors: the scene is drawn a second time from under the ground (see
// "frame") and the paving samples that picture where it is damp, fully where water stands.
const REFL = { tex: { value: null }, res: { value: new T.Vector2(1, 1) } }, groundParts = [];
function wetHook(m, damp) {
  m.onBeforeCompile = (sh) => {
    sh.uniforms.tRefl = REFL.tex; sh.uniforms.uRRes = REFL.res; sh.uniforms.uDamp = { value: damp };
    sh.vertexShader = 'varying vec3 vGW;\n' + sh.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\n vGW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = `uniform sampler2D tRefl; uniform vec2 uRRes; uniform float uDamp; varying vec3 vGW; float gWet = 0.0; float gPud = 0.0;
      float gH(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float gN(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f); return mix(mix(gH(i), gH(i+vec2(1,0)), f.x), mix(gH(i+vec2(0,1)), gH(i+vec2(1,1)), f.x), f.y); }
      float gF(vec2 p){ return gN(p) * 0.5 + gN(p * 2.07 + 13.0) * 0.3 + gN(p * 4.3 + 31.0) * 0.2; }
` + sh.fragmentShader
      .replace('#include <map_fragment>', `#include <map_fragment>
        float gb = gF(vGW.xz * 0.085 + 3.0), gs = gF(vGW.xz * 0.5 + 7.0), lvl = gb * 0.78 + gs * 0.22;
        gPud = smoothstep(0.575, 0.615, lvl);                                             // water standing in the low spots
        gWet = clamp(max(smoothstep(0.34, 0.56, lvl) * 0.8, gPud) * uDamp + gPud, 0.0, 1.0);   // damp brick around them
        diffuseColor.rgb *= 0.8 + 0.4 * gF(vGW.xz * 0.21 + 19.0);                          // uneven wear, hides the tiling
        diffuseColor.rgb = mix(diffuseColor.rgb, pow(diffuseColor.rgb, vec3(1.25)) * mix(0.66, 0.4, gPud), gWet);   // wet brick is darker and richer`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, roughnessFactor * 0.45, gWet); roughnessFactor = mix(roughnessFactor, 0.06, gPud);`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        normal = normalize(mix(normal, geometryNormal, gPud * 0.97));`)
      .replace('#include <output_fragment>', `
        { vec3 gV = normalize(vViewPosition); float ndv = clamp(dot(normal, gV), 0.0, 1.0);
          float fr = 0.025 + 0.975 * pow(1.0 - ndv, 5.0);
          vec2 suv = gl_FragCoord.xy / uRRes; suv.y = 1.0 - suv.y; suv += (normal.xy - geometryNormal.xy) * 0.08;
          float spread = mix(0.011, 0.0012, gPud); vec3 rf = vec3(0.0); float ws = 0.0;
          for (int i = -4; i <= 4; i++) { float w = 1.0 - abs(float(i)) / 5.0; rf += min(texture2D(tRefl, suv + vec2(0.0, float(i) * spread)).rgb, vec3(6.0)) * w; ws += w; }
          float k = mix(fr * 0.6, mix(fr, 1.0, 0.3), gPud) * gWet;
          outgoingLight = outgoingLight * (1.0 - k) + rf / ws * k; }
        #include <output_fragment>`);
  };
  return m;
}
{
  const puddles = []; for (let i = 0; i < 34; i++) puddles.push([Math.random(), Math.random(), 0.03 + Math.random() * 0.09]);
  const mk = (kind) => canvasTex(1024, (g, s) => {
    const cols = 16, rows = 32, w = s / cols, h = s / rows;
    g.fillStyle = kind === 'col' ? '#4f4944' : '#404040'; g.fillRect(0, 0, s, s);
    for (let r = 0; r < rows; r++) for (let c = -1; c <= cols; c++) {
      const x = c * w + (r % 2) * w / 2, y = r * h, v = Math.random();
      g.fillStyle = kind === 'col' ? `hsl(${10 + v * 14},${12 + v * 16}%,${34 + v * 10}%)` : kind === 'bump' ? `rgb(${190 + v * 60},${190 + v * 60},${190 + v * 60})` : `rgb(0,${150 + v * 80},0)`;
      g.fillRect(x + 1.5, y + 1.5, w - 3, h - 3);
    }
    if (kind === 'col') speckle(g, s, 16000, 0.14, true);
    if (false) puddles.forEach(([px, py, pr]) => { for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
      const gr = g.createRadialGradient((px + ox) * s, (py + oy) * s, 0, (px + ox) * s, (py + oy) * s, pr * s);
      gr.addColorStop(0, kind === 'col' ? 'rgba(20,16,14,.6)' : 'rgba(0,14,0,1)'); gr.addColorStop(0.7, kind === 'col' ? 'rgba(20,16,14,.45)' : 'rgba(0,18,0,.95)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.beginPath(); g.ellipse((px + ox) * s, (py + oy) * s, pr * s, pr * s * 0.7, 0.6, 0, 7); g.fill(); } });
  }, 66);
  const rough = mk('rough'); rough.encoding = T.LinearEncoding; const bump = mk('bump'); bump.encoding = T.LinearEncoding;

const COMMON = `precision highp float; varying vec2 vUv; uniform sampler2D tDepth; uniform mat4 uProjInv, uCamWorld; uniform vec3 uCamPos, uSunDir; uniform float uNear, uFar, uTime;
  float viewZ(float d){ float z = d * 2.0 - 1.0; return 2.0 * uNear * uFar / (uFar + uNear - z * (uFar - uNear)); }
  vec3 worldAt(vec2 uv, float d){ vec4 v = uProjInv * vec4(uv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0); v /= v.w; return (uCamWorld * v).xyz; }
  float ign(vec2 p){ return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }`;
const shared = { tDepth: { value: null }, uProjInv: { value: new T.Matrix4() }, uCamWorld: { value: new T.Matrix4() }, uCamPos: { value: new T.Vector3() }, uSunDir: { value: SUN_DIR }, uNear: { value: 0.1 }, uFar: { value: 500 }, uTime };
const pass = (frag, uniforms) => new T.ShaderMaterial({ vertexShader: VS, fragmentShader: frag, uniforms: Object.assign({}, shared, uniforms), depthTest: false, depthWrite: false });

// light shafts: walk each view ray through the air and ask the sun's shadow map, step by step, "is this bit of air lit?"
const volMat = pass(COMMON + `uniform sampler2D tShadow; uniform mat4 uShadowMat;
  float sh(vec3 p){ vec4 s = uShadowMat * vec4(p, 1.0); s.xyz /= s.w; if (s.x < 0.0 || s.x > 1.0 || s.y < 0.0 || s.y > 1.0 || s.z > 1.0) return 1.0;
    return step(s.z - 0.0015, dot(texture2D(tShadow, s.xy), vec4(5.9371e-8, 1.51992e-5, 0.00389099, 0.99609375))); }
  void main(){
    float d = texture2D(tDepth, vUv).x; vec3 wp = worldAt(vUv, d); vec3 rd = wp - uCamPos; float dist = min(length(rd), 95.0); rd = normalize(rd);
    const int N = 44; float stp = dist / float(N), t = stp * ign(gl_FragCoord.xy + fract(uTime) * 61.0), acc = 0.0;
    for (int i = 0; i < N; i++) { vec3 p = uCamPos + rd * t; acc += sh(p) * exp(-max(p.y, 0.0) * 0.055) * stp; t += stp; }
    float cs = dot(rd, uSunDir), g = 0.72, phase = (1.0 - g * g) / pow(1.0 + g * g - 2.0 * g * cs, 1.5) * 0.25 + 0.12;
    gl_FragColor = vec4(vec3(1.0, 0.94, 0.84) * acc * phase * 0.0032, 1.0);   // only a breath of sunlit haze
  }`, { tShadow: { value: null }, uShadowMat: { value: new T.Matrix4() } });
const brightMat = pass(COMMON + 'uniform sampler2D tScene; void main(){ vec3 c = texture2D(tScene, vUv).rgb; float l = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(min(c, vec3(12.0)) * smoothstep(1.6, 3.4, l), 1.0); }', { tScene: { value: null } });
const blurMat = pass(COMMON + `uniform sampler2D tSrc; uniform vec2 uDir;
  void main(){ vec3 c = texture2D(tSrc, vUv).rgb * 0.227; c += (texture2D(tSrc, vUv + uDir * 1.385).rgb + texture2D(tSrc, vUv - uDir * 1.385).rgb) * 0.316; c += (texture2D(tSrc, vUv + uDir * 3.231).rgb + texture2D(tSrc, vUv - uDir * 3.231).rgb) * 0.070; gl_FragColor = vec4(c, 1.0); }`, { tSrc: { value: null }, uDir: { value: new T.Vector2() } });
// contact shading: for each pixel, look at its neighbours in depth and darken where nearby surfaces close it in
const aoMat = pass(COMMON + `uniform vec2 uPS;
  void main(){
    float d = texture2D(tDepth, vUv).x; if (d >= 0.99999) { gl_FragColor = vec4(1.0); return; }
    vec3 p = worldAt(vUv, d); vec3 n = normalize(cross(dFdx(p), dFdy(p))); if (dot(n, uCamPos - p) < 0.0) n = -n;
    float vz = viewZ(d), a0 = ign(gl_FragCoord.xy) * 6.2832, occ = 0.0; const float RAD = 0.7;
    vec2 sc = min(uPS * RAD / vz, vec2(0.07));
    for (int i = 0; i < 12; i++) { float fi = (float(i) + 0.5) / 12.0, a = a0 + float(i) * 2.39996; vec2 u = vUv + vec2(cos(a), sin(a)) * sqrt(fi) * sc;
      float ds = texture2D(tDepth, u).x; vec3 q = worldAt(u, ds) - p; float l2 = dot(q, q);
      occ += max(dot(n, q) - 0.03 - 0.004 * vz, 0.0) / (l2 + 0.02) * step(l2, RAD * RAD * 3.0); }
    gl_FragColor = vec4(vec3(clamp(1.0 - occ * RAD * 2.2 / 12.0, 0.0, 1.0)), 1.0);
  }`, { uPS: { value: new T.Vector2(1, 1) } });
const finalMat = pass(COMMON + `uniform sampler2D tScene, tVol, tBloomA, tBloomB, tAO; uniform vec2 uRes;
  vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
  void main(){
    float d = texture2D(tDepth, vUv).x; bool isSky = d >= 0.99999; vec3 wp = worldAt(vUv, d); vec3 rd = wp - uCamPos; float dist = length(rd); rd /= dist;
    // LENS: focused a few metres out; the distance and anything right at the glass go slightly soft
    float vz = viewZ(d), coc = isSky ? 1.0 : max(clamp((vz - 18.0) / 80.0, 0.0, 1.0), clamp(1.0 - vz / 0.9, 0.0, 1.0));
    float rad = coc * 1.6 * uRes.y / 800.0; vec3 c = texture2D(tScene, vUv).rgb;
    if (rad > 0.2) { for (int i = 0; i < 8; i++) { float a = float(i) * 2.39996, r = sqrt((float(i) + 0.5) / 8.0) * rad; c += texture2D(tScene, vUv + vec2(cos(a), sin(a)) * r / uRes).rgb; } c /= 9.0; }
    vec3 v = vec3(0.0); float ao = 0.0; vec2 px = 2.0 / uRes;
    for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++) { vec2 o = vec2(float(i), float(j)) * px * 1.5; v += texture2D(tVol, vUv + o).rgb; ao += texture2D(tAO, vUv + o).r; }
    float sd = max(dot(rd, uSunDir), 0.0);
    if (!isSky) {
      c *= mix(1.0, ao / 9.0, 0.9);
      // AIR: plain aerial perspective, things fade toward the colour of the horizon
      vec3 f = 1.0 - exp(-dist * vec3(0.0020, 0.0025, 0.0032));
      vec3 fc = vec3(0.60, 0.70, 0.84) + vec3(0.4, 0.36, 0.28) * pow(sd, 6.0);
      c = mix(c, fc, f);
    }
    c += v / 9.0;
    c += texture2D(tBloomA, vUv).rgb * 0.10 + texture2D(tBloomB, vUv).rgb * 0.12;
    // FINISH: a little corner fall-off, film curve, a touch of contrast, sensor grain. No colour grade.
    vec2 q = vUv - 0.5; c *= 1.0 - dot(q, q) * 0.32;
    c = aces(c * EXPOSURE);
    float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
    c *= mix(l, l * l * (3.0 - 2.0 * l), 0.3) / max(l, 1e-4);
    c = pow(max(c, 0.0), vec3(1.0 / 2.2));
    c += (ign(gl_FragCoord.xy + fract(uTime) * 100.0) - 0.5) / 255.0 * 2.5;
    gl_FragColor = vec4(c, 1.0);
  }`.replace('EXPOSURE', (parseFloat(QS.get('ev')) || 0.56).toFixed(3)), { tScene: { value: null }, tVol: { value: null }, tBloomA: { value: null }, tBloomB: { value: null }, tAO: { value: null }, uRes: { value: new T.Vector2(1, 1) } });

const hdr = (w, h, depth) => { const rt = new T.WebGLRenderTarget(w, h, { type: T.HalfFloatType, depthBuffer: !!depth, minFilter: T.LinearFilter, magFilter: T.LinearFilter });
  if (depth) { rt.depthTexture = new T.DepthTexture(w, h); rt.depthTexture.type = T.UnsignedIntType; } return rt; };
const rtScene = hdr(4, 4, true), rtRefl = hdr(2, 2, true), rtAO = hdr(2, 2), rtVol = hdr(2, 2), rtB1 = hdr(2, 2), rtB2 = hdr(2, 2), rtB3 = hdr(2, 2), rtB4 = hdr(2, 2);
const reflCam = new T.PerspectiveCamera(52, 1, 0.1, 500), reflEuler = new T.Euler();
function resize() {
  const w = window.innerWidth, h = window.innerHeight, W = Math.floor(w * PR), H = Math.floor(h * PR);
  renderer.setPixelRatio(PR); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); reflCam.fov = camera.fov; reflCam.aspect = w / h; reflCam.updateProjectionMatrix();
  rtScene.setSize(W, H); rtRefl.setSize(W >> 1, H >> 1); rtAO.setSize(W >> 1, H >> 1); REFL.tex.value = rtRefl.texture; REFL.res.value.set(W, H); rtVol.setSize(W >> 1, H >> 1); rtB1.setSize(W >> 2, H >> 2); rtB2.setSize(W >> 2, H >> 2); rtB3.setSize(W >> 3, H >> 3); rtB4.setSize(W >> 3, H >> 3);
  finalMat.uniforms.uRes.value.set(W, H);
}
window.addEventListener('resize', resize); resize();
const draw = (mat, target) => { fsTri.material = mat; renderer.setRenderTarget(target); renderer.render(fsScene, fsCam); };
const blur = (src, tmp, dst, r) => { blurMat.uniforms.tSrc.value = src.texture; blurMat.uniforms.uDir.value.set(r / tmp.width, 0); draw(blurMat, tmp); blurMat.uniforms.tSrc.value = tmp.texture; blurMat.uniforms.uDir.value.set(0, r / dst.height); draw(blurMat, dst); };

// ── camera: six viewpoints, drag to look, keys to walk ───────────────────────────────────────
const VIEWS = [[0, 1.6, 47, 0, 7.5, 0], [-9, 1.5, 33, 7, 6, 4], [15, 1.3, 36, -8, 6.5, 6], [0, 10, 56, 0, 5, 6], [-11, 1.5, 30, -22, 12, -8], [21, 1.7, 44, -12, 4.5, 14]];
let yaw = 0, pitch = 0; const pos = new T.Vector3(), keys = {};
function setView(i) { const v = VIEWS[i]; pos.set(v[0], v[1], v[2]); const dx = v[3] - v[0], dy = v[4] - v[1], dz = v[5] - v[2]; yaw = Math.atan2(-dx, -dz); pitch = Math.atan2(dy, Math.hypot(dx, dz)); mode = 'fixed'; }
// follow: the camera rides behind the character; fixed: it stands at a viewpoint and she still walks
let mode = 'follow', camYaw = 0, camPitch = 0.13, camDist = 3.4;
const heroPos = new T.Vector3(0, 0, 43), camTarget = new T.Vector3(0, 0.72, 43); let heroHead = Math.PI, heroSpeed = 0, heroTurn = 0;
if (QS.get('view')) setView(Math.max(0, Math.min(5, (parseInt(QS.get('view'), 10) || 1) - 1)));
if (QS.get('close')) { camDist = 1.9; camYaw = Math.PI - 0.5; camPitch = 0.06; }            // ?close=1 looks at her face
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag[0], dy = e.clientY - drag[1]; drag = [e.clientX, e.clientY];
  if (mode === 'follow') { camYaw -= dx * 0.005; camPitch = Math.max(-0.12, Math.min(1.25, camPitch + dy * 0.004)); }
  else { yaw -= dx * 0.0035; pitch = Math.max(-1.2, Math.min(1.35, pitch - dy * 0.0035)); } });
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); camDist = Math.max(1.3, Math.min(11, camDist * (1 + Math.sign(e.deltaY) * 0.08))); }, { passive: false });
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key >= '1' && e.key <= '6') setView(+e.key - 1); if (e.key === '0' || e.key.toLowerCase() === 'f') mode = 'follow'; if (e.key.toLowerCase() === 'h' && hero && hero.wave) hero.wave(); });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ── frame ────────────────────────────────────────────────────────────────────────────────────
const sunV = new T.Vector3(); let last = performance.now(), fpsAcc = 0, fpsN = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000; uTime.value = t; sky.material.uniforms.uTime.value = t;
  const f = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0), sd = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  const fy = mode === 'follow' ? camYaw : yaw, mx = -Math.sin(fy) * f + Math.cos(fy) * sd, mz = -Math.cos(fy) * f - Math.sin(fy) * sd, want = (f || sd) ? (keys.shift ? HERO.RUN : HERO.WALK) : 0;
  let turnRate = 0;
  if (f || sd) { let d = Math.atan2(mx, mz) - heroHead; d = Math.atan2(Math.sin(d), Math.cos(d)); const step = Math.sign(d) * Math.min(Math.abs(d), 7.5 * dt); heroHead += step; turnRate = step / Math.max(dt, 1e-4); }
  heroSpeed += (want - heroSpeed) * Math.min(1, dt * (want > heroSpeed ? 5 : 9)); heroTurn += (turnRate - heroTurn) * Math.min(1, dt * 8);
  heroPos.x = Math.max(-21, Math.min(21, heroPos.x + Math.sin(heroHead) * heroSpeed * dt)); heroPos.z = Math.max(11, Math.min(60, heroPos.z + Math.cos(heroHead) * heroSpeed * dt));
  if (heroPos.z > 59.5 && !window.__leaving) { window.__leaving = true; location.href = 'square.html'; }                 // out of the south end, back to the square
  if (hero) { hero.group.position.copy(heroPos); hero.group.rotation.y = heroHead; hero.update(dt, heroSpeed, heroTurn); }
  if (mode === 'follow') {
    camTarget.lerp(new T.Vector3(heroPos.x, 0.72, heroPos.z), Math.min(1, dt * 7));
    const cp = Math.cos(camPitch); camera.position.set(camTarget.x + Math.sin(camYaw) * cp * camDist, Math.max(0.22, camTarget.y + Math.sin(camPitch) * camDist), camTarget.z + Math.cos(camYaw) * cp * camDist);
    camera.lookAt(camTarget.x, camTarget.y + 0.12 + camDist * 0.08, camTarget.z);
  } else { camera.position.copy(pos); camera.position.y += Math.sin(t * 0.6) * 0.015; camera.rotation.set(pitch, yaw, 0, 'YXZ'); }
  camera.updateMatrixWorld();
  sky.position.copy(camera.position);
  if (false && walker) { const a = t * 0.11; walker.position.set(Math.sin(a) * 6.5, 0, 31 + Math.cos(a) * 9); walker.rotation.y = a + Math.PI / 2; const k = Math.floor(t * 3.4) % 2; walker.children[0].visible = !k; if (walker.children[1]) walker.children[1].visible = !!k; }
  if (lanterns) lanterns.rotation.z = 0;                                                    // (strings are fixed; the leaves carry the wind)
  sunV.copy(SUN_DIR).transformDirection(camera.matrixWorldInverse); leafMats.forEach(m => { if (m.userData.sh) m.userData.sh.uniforms.uSunV.value.copy(sunV); });
  if (steam) steam.material.uniforms.uPx.value = PR;

  // the mirror picture for the wet paving: the same camera, flipped under the ground, with the ground hidden
  reflEuler.setFromQuaternion(camera.quaternion, 'YXZ'); reflCam.position.set(camera.position.x, -camera.position.y, camera.position.z); reflCam.rotation.set(-reflEuler.x, reflEuler.y, 0, 'YXZ'); reflCam.updateMatrixWorld();
  groundParts.forEach(g => { g.visible = false; }); sky.position.copy(reflCam.position);
  renderer.shadowMap.autoUpdate = true; renderer.setRenderTarget(rtRefl); renderer.render(scene, reflCam);
  groundParts.forEach(g => { g.visible = true; }); sky.position.copy(camera.position); renderer.shadowMap.autoUpdate = false;   // shadows were just drawn; reuse them
  renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
  shared.tDepth.value = rtScene.depthTexture; shared.uProjInv.value.copy(camera.projectionMatrixInverse); shared.uCamWorld.value.copy(camera.matrixWorld); shared.uCamPos.value.copy(camera.position);
  if (sun.shadow.map) { volMat.uniforms.tShadow.value = sun.shadow.map.texture; volMat.uniforms.uShadowMat.value.copy(sun.shadow.matrix); draw(volMat, rtVol); }
  aoMat.uniforms.uPS.value.set(camera.projectionMatrix.elements[0] * 0.5, camera.projectionMatrix.elements[5] * 0.5); draw(aoMat, rtAO);
  brightMat.uniforms.tScene.value = rtScene.texture; draw(brightMat, rtB1); blur(rtB1, rtB2, rtB1, 1.6); blur(rtB1, rtB3, rtB4, 2.4); blur(rtB4, rtB3, rtB4, 3.0);
  finalMat.uniforms.tScene.value = rtScene.texture; finalMat.uniforms.tVol.value = rtVol.texture; finalMat.uniforms.tBloomA.value = rtB1.texture; finalMat.uniforms.tBloomB.value = rtB4.texture; finalMat.uniforms.tAO.value = rtAO.texture;
  draw(finalMat, null);
  fpsAcc += dt; fpsN++; if (fpsAcc > 1) { state.fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__remake = Object.assign(state, { setView, VIEWS, renderer, scene, camera, sun, keys, cam(y, p, d) { mode = 'follow'; camYaw = y; camPitch = p; camDist = d; } });
Object.defineProperty(window.__remake, 'hero', { get() { return hero; } });
})();
</script>
