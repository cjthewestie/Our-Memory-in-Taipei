const DADAO_BOARDS = (() => {

  return {
    // 年貨大街 archway: side panels with couplet words, the gate painting in the middle, the name in carved gold over it
    gate(g, W, H) {

      else { const sky = g.createLinearGradient(0, b, 0, H - b); sky.addColorStop(0, '#2a0f2a'); sky.addColorStop(0.6, '#8a1f1c'); sky.addColorStop(1, '#e0733a'); g.fillStyle = sky; g.fillRect(px, b, W - 2 * px, H - 2 * b);
        g.fillStyle = 'rgba(30,8,8,.75)'; for (let x = px; x < W - px; x += 46) { const h = H * (0.28 + ((x * 7) % 5) * 0.03); g.fillRect(x, H - b - h, 42, h); g.beginPath(); g.moveTo(x - 3, H - b - h); g.quadraticCurveTo(x + 21, H - b - h - 18, x + 45, H - b - h); g.fill(); }

      const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#3a1f4a'); sky.addColorStop(0.55, '#e86a3a'); sky.addColorStop(1, '#f3c14b'); g.fillStyle = sky; g.fillRect(sx, 0, W - sx, H);

})();

  sunDir: [-24, 30, -46], shadowCenter: [0, 0, -2], start: { x: 0.4, z: 29.5, heading: Math.PI },

  ground: { puddles: 14, puddle: (rr) => [rr(-3.6, 3.6), rr(-33, 33), rr(0, 3)] },   // wet brick from wall to wall
  dust: { x: [-6, 12], y: [0.3, 8], z: [-36, 36] },
  clamp(p) {
    for (let pass = 0; pass < 2; pass++) {
      let best = null, bd = 1e9;
      for (const [x0, x1, z0, z1] of AREAS) { const cx = Math.max(x0, Math.min(x1, p.x)), cz = Math.max(z0, Math.min(z1, p.z)), d = Math.hypot(cx - p.x, cz - p.z); if (d < bd) { bd = d; best = [cx, cz]; } }

  models: ['bundle-dadao', 'bundle-core', 'bundle-square'],

  const zone2 = get(dadao, 'dihua-zone2'), kit = (...parts) => { const g = new T.Group(); parts.forEach(n => g.add(get(zone2, n).clone())); return g; };

  let k = 0; for (let z = 31; z > -51; z -= 1.9, k++) { const a = anchor(-1, z, k), b = anchor(1, z + (k % 2 ? 1.2 : -1.2), k + 1); if (a && b) lanternString(a, b, b.x > 5 ? 1.5 : 0.8); }
